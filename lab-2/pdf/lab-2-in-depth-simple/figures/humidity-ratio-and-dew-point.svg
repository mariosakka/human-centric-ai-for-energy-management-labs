<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Arial, Helvetica, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c53030"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b6cb0"/></marker></defs><rect width="900" height="500" fill="#fff"/><text x="450" y="34" font-size="22" text-anchor="middle" fill="#1a202c" font-weight="bold">Cooling humid air: dew point and condensation</text><rect x="40" y="70" width="260" height="280" rx="12" fill="#f7fafc" stroke="#2f855a" stroke-width="3"/><text x="170" y="102" font-size="18" text-anchor="middle" fill="#2f855a" font-weight="bold">30 °C, RH 60 %</text><text x="170" y="128" font-size="16" text-anchor="middle" fill="#1a202c" font-weight="normal">x = 16.3 g/kg</text><circle cx="177" cy="284" r="6" fill="#2b6cb0" stroke="none"/><circle cx="68" cy="212" r="6" fill="#2b6cb0" stroke="none"/><circle cx="132" cy="202" r="6" fill="#2b6cb0" stroke="none"/><circle cx="92" cy="239" r="6" fill="#2b6cb0" stroke="none"/><circle cx="130" cy="262" r="6" fill="#2b6cb0" stroke="none"/><circle cx="269" cy="157" r="6" fill="#2b6cb0" stroke="none"/><circle cx="195" cy="183" r="6" fill="#2b6cb0" stroke="none"/><circle cx="75" cy="201" r="6" fill="#2b6cb0" stroke="none"/><circle cx="218" cy="267" r="6" fill="#2b6cb0" stroke="none"/><circle cx="277" cy="163" r="6" fill="#2b6cb0" stroke="none"/><text x="170" y="338" font-size="1" text-anchor="middle" fill="#4a5568" font-weight="normal"></text><text x="170" y="378" font-size="16" text-anchor="middle" fill="#2f855a" font-weight="bold">air is not full</text><rect x="320" y="70" width="260" height="280" rx="12" fill="#f7fafc" stroke="#2b6cb0" stroke-width="3"/><text x="450" y="102" font-size="18" text-anchor="middle" fill="#2b6cb0" font-weight="bold">21.4 °C, RH 100 %</text><text x="450" y="128" font-size="16" text-anchor="middle" fill="#1a202c" font-weight="normal">x = 16.3 g/kg</text><circle cx="454" cy="280" r="6" fill="#2b6cb0" stroke="none"/><circle cx="501" cy="172" r="6" fill="#2b6cb0" stroke="none"/><circle cx="452" cy="289" r="6" fill="#2b6cb0" stroke="none"/><circle cx="422" cy="176" r="6" fill="#2b6cb0" stroke="none"/><circle cx="447" cy="219" r="6" fill="#2b6cb0" stroke="none"/><circle cx="363" cy="281" r="6" fill="#2b6cb0" stroke="none"/><circle cx="521" cy="241" r="6" fill="#2b6cb0" stroke="none"/><circle cx="499" cy="210" r="6" fill="#2b6cb0" stroke="none"/><circle cx="482" cy="272" r="6" fill="#2b6cb0" stroke="none"/><circle cx="383" cy="277" r="6" fill="#2b6cb0" stroke="none"/><circle cx="463" cy="211" r="6" fill="#2b6cb0" stroke="none"/><circle cx="467" cy="204" r="6" fill="#2b6cb0" stroke="none"/><circle cx="346" cy="271" r="6" fill="#2b6cb0" stroke="none"/><circle cx="559" cy="197" r="6" fill="#2b6cb0" stroke="none"/><circle cx="500" cy="201" r="6" fill="#2b6cb0" stroke="none"/><circle cx="405" cy="243" r="6" fill="#2b6cb0" stroke="none"/><text x="450" y="338" font-size="1" text-anchor="middle" fill="#4a5568" font-weight="normal"></text><text x="450" y="378" font-size="16" text-anchor="middle" fill="#2b6cb0" font-weight="bold">dew point: air is full</text><rect x="600" y="70" width="260" height="280" rx="12" fill="#f7fafc" stroke="#c53030" stroke-width="3"/><text x="730" y="102" font-size="18" text-anchor="middle" fill="#c53030" font-weight="bold">15 °C, RH 100 %</text><text x="730" y="128" font-size="16" text-anchor="middle" fill="#1a202c" font-weight="normal">x = 10.8 g/kg</text><circle cx="687" cy="194" r="6" fill="#2b6cb0" stroke="none"/><circle cx="781" cy="206" r="6" fill="#2b6cb0" stroke="none"/><circle cx="658" cy="227" r="6" fill="#2b6cb0" stroke="none"/><circle cx="646" cy="199" r="6" fill="#2b6cb0" stroke="none"/><circle cx="723" cy="206" r="6" fill="#2b6cb0" stroke="none"/><circle cx="729" cy="157" r="6" fill="#2b6cb0" stroke="none"/><circle cx="797" cy="159" r="6" fill="#2b6cb0" stroke="none"/><circle cx="762" cy="234" r="6" fill="#2b6cb0" stroke="none"/><circle cx="622" cy="237" r="6" fill="#2b6cb0" stroke="none"/><circle cx="814" cy="198" r="6" fill="#2b6cb0" stroke="none"/><path d="M640,300 q-8,14 0,18 q8,-4 0,-18 z" fill="#2b6cb0"/><path d="M676,300 q-8,14 0,18 q8,-4 0,-18 z" fill="#2b6cb0"/><path d="M712,300 q-8,14 0,18 q8,-4 0,-18 z" fill="#2b6cb0"/><path d="M748,300 q-8,14 0,18 q8,-4 0,-18 z" fill="#2b6cb0"/><path d="M784,300 q-8,14 0,18 q8,-4 0,-18 z" fill="#2b6cb0"/><path d="M820,300 q-8,14 0,18 q8,-4 0,-18 z" fill="#2b6cb0"/><line x1="620" y1="322" x2="840" y2="322" stroke="#4a5568" stroke-width="3"/><text x="730" y="342" font-size="1" text-anchor="middle" fill="#4a5568" font-weight="normal"></text><text x="730" y="378" font-size="16" text-anchor="middle" fill="#c53030" font-weight="bold">5.5 g/kg turned into drops</text><line x1="305" y1="210" x2="318" y2="210" stroke="#4a5568" stroke-width="3" marker-end="url(#a)"/><line x1="585" y1="210" x2="598" y2="210" stroke="#4a5568" stroke-width="3" marker-end="url(#a)"/><text x="450" y="430" font-size="16" text-anchor="middle" fill="#4a5568" font-weight="normal">Cooling does not remove water until the dew point is reached.</text><text x="450" y="456" font-size="16" text-anchor="middle" fill="#4a5568" font-weight="normal">Then the extra water appears on cold surfaces: a glass, a window, a cooling coil.</text><text x="450" y="482" font-size="16" text-anchor="middle" fill="#2f855a" font-weight="bold">In a 72 m³ room, cooling 30 °C air to 15 °C releases about 459 g of water.</text></svg>