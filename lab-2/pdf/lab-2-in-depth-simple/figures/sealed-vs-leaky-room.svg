<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Arial, Helvetica, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c53030"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b6cb0"/></marker></defs><rect width="900" height="500" fill="#fff"/><text x="450" y="34" font-size="22" text-anchor="middle" fill="#1a202c" font-weight="bold">Heating a room from 30 °C to 40 °C (start: 60 % RH, dew point 21.4 °C)</text><rect x="40" y="70" width="380" height="200" rx="12" fill="#f7fafc" stroke="#2b6cb0" stroke-width="3"/><text x="230" y="98" font-size="18" text-anchor="middle" fill="#2b6cb0" font-weight="bold">Leaky room (pressure stays 1 bar)</text><rect x="120" y="120" width="220" height="120" rx="6" fill="#fff" stroke="#4a5568" stroke-width="4"/><text x="230" y="186" font-size="28" text-anchor="middle" fill="#c53030" font-weight="bold">40 °C</text><line x1="340" y1="150" x2="405" y2="150" stroke="#2b6cb0" stroke-width="3" marker-end="url(#ab)"/><line x1="340" y1="200" x2="405" y2="200" stroke="#2b6cb0" stroke-width="3" marker-end="url(#ab)"/><text x="230" y="310" font-size="16" text-anchor="middle" fill="#1a202c" font-weight="normal">some air escapes through the gaps</text><text x="230" y="338" font-size="16" text-anchor="middle" fill="#1a202c" font-weight="normal">x stays 16.3 g/kg, dew point stays 21.4 °C</text><text x="230" y="366" font-size="16" text-anchor="middle" fill="#1a202c" font-weight="normal">RH falls to 34.5 %</text><rect x="480" y="70" width="380" height="200" rx="12" fill="#f7fafc" stroke="#c53030" stroke-width="3"/><text x="670" y="98" font-size="18" text-anchor="middle" fill="#c53030" font-weight="bold">Sealed room (air stays inside)</text><rect x="560" y="120" width="220" height="120" rx="6" fill="#fff" stroke="#4a5568" stroke-width="4"/><text x="670" y="186" font-size="28" text-anchor="middle" fill="#c53030" font-weight="bold">40 °C</text><text x="670" y="218" font-size="18" text-anchor="middle" fill="#c53030" font-weight="bold">p ↑</text><text x="670" y="310" font-size="16" text-anchor="middle" fill="#1a202c" font-weight="normal">pressure rises to 103 300 Pa</text><text x="670" y="338" font-size="16" text-anchor="middle" fill="#1a202c" font-weight="normal">dew point rises a little, to 21.9 °C</text><text x="670" y="366" font-size="16" text-anchor="middle" fill="#1a202c" font-weight="normal">RH falls to 35.6 %</text><text x="450" y="430" font-size="16" text-anchor="middle" fill="#4a5568" font-weight="normal">Same message in both rooms: heating does not add or remove water by itself,</text><text x="450" y="456" font-size="16" text-anchor="middle" fill="#2f855a" font-weight="bold">so the dew point barely moves while relative humidity drops a lot.</text></svg>