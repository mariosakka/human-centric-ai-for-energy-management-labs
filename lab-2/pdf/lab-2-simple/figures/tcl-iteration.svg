<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Arial, Helvetica, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c53030"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b6cb0"/></marker></defs><rect width="900" height="500" fill="#fff"/><text x="450" y="34" font-size="22" text-anchor="middle" fill="#1a202c" font-weight="bold">The t_cl iteration: guess, correct, repeat until stable</text><line x1="110" y1="420" x2="580" y2="420" stroke="#4a5568" stroke-width="2" marker-end="url(#a)"/><line x1="110" y1="420" x2="110" y2="85" stroke="#4a5568" stroke-width="2" marker-end="url(#a)"/><line x1="110.0" y1="420" x2="110.0" y2="426" stroke="#4a5568" stroke-width="2"/><text x="110.0" y="446" font-size="15" text-anchor="middle" fill="#4a5568" font-weight="normal">2</text><line x1="185.0" y1="420" x2="185.0" y2="426" stroke="#4a5568" stroke-width="2"/><text x="185.0" y="446" font-size="15" text-anchor="middle" fill="#4a5568" font-weight="normal">3</text><line x1="260.0" y1="420" x2="260.0" y2="426" stroke="#4a5568" stroke-width="2"/><text x="260.0" y="446" font-size="15" text-anchor="middle" fill="#4a5568" font-weight="normal">4</text><line x1="335.0" y1="420" x2="335.0" y2="426" stroke="#4a5568" stroke-width="2"/><text x="335.0" y="446" font-size="15" text-anchor="middle" fill="#4a5568" font-weight="normal">5</text><line x1="410.0" y1="420" x2="410.0" y2="426" stroke="#4a5568" stroke-width="2"/><text x="410.0" y="446" font-size="15" text-anchor="middle" fill="#4a5568" font-weight="normal">6</text><line x1="485.0" y1="420" x2="485.0" y2="426" stroke="#4a5568" stroke-width="2"/><text x="485.0" y="446" font-size="15" text-anchor="middle" fill="#4a5568" font-weight="normal">7</text><line x1="560.0" y1="420" x2="560.0" y2="426" stroke="#4a5568" stroke-width="2"/><text x="560.0" y="446" font-size="15" text-anchor="middle" fill="#4a5568" font-weight="normal">8</text><text x="335.0" y="470" font-size="16" text-anchor="middle" fill="#4a5568" font-weight="normal">iteration number</text><text transform="rotate(-90 46 260)" x="46" y="260" font-size="16" text-anchor="middle" fill="#4a5568">clothing surface temperature t_cl [°C]</text><rect x="110" y="103.5" width="450" height="7.1" fill="#c6f6d5" opacity="0.8"/><text x="556" y="95.53761543503492" font-size="14" text-anchor="end" fill="#2f855a" font-weight="bold">stop band (0.15 K)</text><polyline points="110.0,412.9 185.0,205.2 260.0,140.0 335.0,118.3 410.0,110.8 485.0,108.1 560.0,107.1" fill="none" stroke="#2b6cb0" stroke-width="3"/><circle cx="110.0" cy="412.92476912993004" r="5" fill="#2b6cb0" stroke="none"/><circle cx="185.0" cy="205.22213562128127" r="5" fill="#2b6cb0" stroke="none"/><circle cx="260.0" cy="139.95361156923036" r="5" fill="#2b6cb0" stroke="none"/><circle cx="335.0" cy="118.34338227522147" r="5" fill="#2b6cb0" stroke="none"/><circle cx="410.0" cy="110.76918121355385" r="5" fill="#2b6cb0" stroke="none"/><circle cx="485.0" cy="108.05530938631966" r="5" fill="#2b6cb0" stroke="none"/><circle cx="560.0" cy="107.0752308700699" r="5" fill="#c53030" stroke="none"/><text x="120.0" y="400.92476912993004" font-size="15" text-anchor="start" fill="#2b6cb0" font-weight="normal">pass 2: 19.1 °C</text><text x="554.0" y="137.0752308700699" font-size="15" text-anchor="end" fill="#c53030" font-weight="bold">result 32.10 °C</text><text x="590" y="140" font-size="16" text-anchor="start" fill="#c53030" font-weight="bold">Why iterate?</text><text x="590" y="168" font-size="16" text-anchor="start" fill="#4a5568" font-weight="normal">t_cl is needed for the heat losses,</text><text x="590" y="196" font-size="16" text-anchor="start" fill="#4a5568" font-weight="normal">but the losses depend on t_cl.</text><text x="590" y="224" font-size="16" text-anchor="start" fill="#4a5568" font-weight="normal"></text><text x="590" y="252" font-size="16" text-anchor="start" fill="#4a5568" font-weight="normal">So: guess t_cl, compute the</text><text x="590" y="280" font-size="16" text-anchor="start" fill="#4a5568" font-weight="normal">losses, get a better t_cl, repeat.</text><text x="590" y="308" font-size="16" text-anchor="start" fill="#4a5568" font-weight="normal"></text><text x="590" y="336" font-size="16" text-anchor="start" fill="#4a5568" font-weight="normal">Pass 1 overshoots wildly (not</text><text x="590" y="364" font-size="16" text-anchor="start" fill="#4a5568" font-weight="normal">shown); it stops after pass 8</text><text x="590" y="392" font-size="16" text-anchor="start" fill="#4a5568" font-weight="normal">(30 °C outdoor day).</text></svg>