<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2b6cb0"/></marker>
    <g id="person" fill="none" stroke="#4a5568" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="415,200 415,288 535,288" stroke="#a0aec0" stroke-width="4"/>
      <line x1="420" y1="288" x2="420" y2="360" stroke="#a0aec0" stroke-width="4"/>
      <line x1="530" y1="288" x2="530" y2="360" stroke="#a0aec0" stroke-width="4"/>
      <circle cx="440" cy="150" r="26" fill="#ffffff"/>
      <line x1="440" y1="176" x2="440" y2="280"/>
      <polyline points="440,280 520,280 520,350"/>
      <polyline points="440,200 485,240 510,250"/>
    </g>
  </defs>
  <rect width="900" height="500" fill="#ffffff"/>

  <!-- warm room -->
  <rect x="100" y="100" width="760" height="320" fill="#fffaf0" stroke="#a0aec0" stroke-width="2"/>
  <text x="480" y="130" font-size="15" fill="#4a5568" text-anchor="middle">winter, warm heated room</text>

  <!-- cold window -->
  <rect x="100" y="100" width="16" height="320" fill="#bee3f8" stroke="#2b6cb0" stroke-width="2.5"/>
  <text x="130" y="152" font-size="16" font-weight="bold" fill="#2b6cb0">Cold window glass</text>
  <text x="130" y="172" font-size="14" fill="#4a5568">surface about 8 C</text>

  <!-- person facing the window -->
  <use href="#person" transform="translate(900,60) scale(-1,1)"/>

  <!-- radiation loss toward the window -->
  <g stroke="#2b6cb0" stroke-width="3" stroke-dasharray="9 6" fill="none">
    <line x1="430" y1="262" x2="125" y2="262" marker-end="url(#ah-blue)"/>
    <line x1="430" y1="292" x2="125" y2="292" marker-end="url(#ah-blue)"/>
  </g>
  <text x="270" y="232" font-size="16" font-weight="bold" fill="#2b6cb0" text-anchor="middle">Body heat radiates</text>
  <text x="270" y="250" font-size="14" fill="#4a5568" text-anchor="middle">to the cold surface</text>

  <!-- thermometer: air temperature -->
  <rect x="644" y="118" width="14" height="124" rx="7" fill="#ffffff" stroke="#4a5568" stroke-width="3"/>
  <rect x="648" y="170" width="6" height="72" fill="#c53030"/>
  <circle cx="651" cy="256" r="17" fill="#c53030" stroke="#4a5568" stroke-width="3"/>
  <g stroke="#4a5568" stroke-width="2"><line x1="662" y1="140" x2="672" y2="140"/><line x1="662" y1="170" x2="672" y2="170"/><line x1="662" y1="200" x2="672" y2="200"/></g>
  <text x="690" y="170" font-size="15" font-weight="bold" fill="#4a5568">Air temperature</text>
  <text x="690" y="200" font-size="26" font-weight="bold" fill="#c53030">t_a = 22 C</text>

  <!-- operative temperature box -->
  <rect x="520" y="310" width="340" height="94" rx="10" fill="#ffffff" stroke="#4a5568" stroke-width="2.5"/>
  <text x="535" y="335" font-size="15" font-weight="bold" fill="#1a202c">Operative temperature t_o = what you feel</text>
  <text x="535" y="360" font-size="15" fill="#4a5568">t_o is about (t_a + t_mr) / 2</text>
  <text x="535" y="386" font-size="15" fill="#2b6cb0" font-weight="bold">(22 + 17) / 2 = 19.5 C, with t_mr = 17 C</text>

  <line x1="100" y1="420" x2="860" y2="420" stroke="#4a5568" stroke-width="3"/>
  <text x="450" y="462" font-size="20" font-weight="bold" fill="#4a5568" text-anchor="middle">warm air, cold walls: still feels cold</text>
</svg>
