<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Arial, Helvetica, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c53030"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b6cb0"/></marker></defs><rect width="900" height="500" fill="#fff"/><text x="450" y="34" font-size="22" text-anchor="middle" fill="#1a202c" font-weight="bold">Enthalpy of 30 °C, 60 % air: 71.6 kJ per kg of dry air</text><rect x="70.0" y="140" width="318.6" height="110" fill="#bee3f8" stroke="#2b6cb0" stroke-width="2"/><rect x="388.6" y="140" width="9.6" height="110" fill="#bee3f8" stroke="#2b6cb0" stroke-width="2"/><rect x="398.2" y="140" width="431.8" height="110" fill="#fed7d7" stroke="#c53030" stroke-width="2"/><text x="229.30687534935717" y="190" font-size="18" text-anchor="middle" fill="#2b6cb0" font-weight="bold">sensible heat of dry air</text><text x="229.30687534935717" y="218" font-size="16" text-anchor="middle" fill="#2b6cb0" font-weight="normal">30.0 kJ/kg (you can feel it)</text><text x="613.7674678591392" y="190" font-size="18" text-anchor="middle" fill="#c53030" font-weight="bold">latent heat of the vapour</text><text x="613.7674678591392" y="218" font-size="16" text-anchor="middle" fill="#c53030" font-weight="normal">40.7 kJ/kg (you cannot feel it)</text><line x1="394.61375069871434" y1="130" x2="394.61375069871434" y2="100" stroke="#2b6cb0" stroke-width="2" marker-end="url(#ab)"/><text x="394.61375069871434" y="92" font-size="14" text-anchor="middle" fill="#2b6cb0" font-weight="normal">vapour sensible: 0.9</text><rect x="70" y="290" width="328.2" height="14" fill="#2b6cb0"/><rect x="398.2" y="290" width="431.8" height="14" fill="#c53030"/><text x="234.0860816098379" y="330" font-size="17" text-anchor="middle" fill="#2b6cb0" font-weight="bold">sensible: 43 %</text><text x="614.0860816098378" y="330" font-size="17" text-anchor="middle" fill="#c53030" font-weight="bold">latent: 57 %</text><text x="450" y="395" font-size="20" text-anchor="middle" fill="#1a202c" font-weight="bold">h = t + x · (2500 + 1.84 · t)</text><text x="450" y="425" font-size="16" text-anchor="middle" fill="#4a5568" font-weight="normal">temperature part + water part (x = 0.01626 kg/kg)</text><text x="450" y="462" font-size="16" text-anchor="middle" fill="#2f855a" font-weight="bold">On a humid day, more than half of the energy the air carries is hidden in the water vapour.</text></svg>