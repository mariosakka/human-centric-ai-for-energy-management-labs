="bold">Density</text><text x="690" y="382" font-size="18" text-anchor="middle" fill="#1a202c" font-weight="normal">ρ = m / V = 1.17 kg/m³</text><text x="690" y="440" font-size="14" text-anchor="middle" fill="#4a5568" font-weight="normal">R = 287 J/(kg·K), T = 298.15 K, p = 100 000 Pa</text></svg>