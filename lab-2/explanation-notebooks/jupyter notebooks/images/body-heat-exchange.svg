<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c53030"/></marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2b6cb0"/></marker>
    <g id="person" fill="none" stroke="#4a5568" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="415,200 415,288 535,288" stroke="#a0aec0" stroke-width="4"/>
      <line x1="420" y1="288" x2="420" y2="360" stroke="#a0aec0" stroke-width="4"/>
      <line x1="530" y1="288" x2="530" y2="360" stroke="#a0aec0" stroke-width="4"/>
      <circle cx="440" cy="150" r="26" fill="#ffffff"/>
      <line x1="440" y1="176" x2="440" y2="280"/>
      <polyline points="440,280 520,280 520,350"/>
      <polyline points="440,200 485,240 510,250"/>
    </g>
  </defs>
  <rect width="900" height="500" fill="#ffffff"/>

  <!-- wall / window on the left, floor -->
  <rect x="40" y="90" width="26" height="272" fill="#e2e8f0" stroke="#4a5568" stroke-width="2"/>
  <text x="53" y="82" font-size="14" fill="#4a5568" text-anchor="middle">wall / window</text>
  <line x1="40" y1="362" x2="860" y2="362" stroke="#a0aec0" stroke-width="3"/>

  <!-- body with metabolic heat source -->
  <rect x="424" y="180" width="32" height="100" rx="14" fill="#fed7d7"/>
  <use href="#person"/>
  <circle cx="440" cy="232" r="19" fill="#fed7d7" stroke="#c53030" stroke-width="3"/>
  <text x="440" y="239" font-size="20" font-weight="bold" fill="#9b2c2c" text-anchor="middle">M</text>

  <!-- radiation to the wall (dashed) -->
  <g stroke="#c53030" stroke-width="3" stroke-dasharray="9 6" fill="none">
    <line x1="395" y1="205" x2="75" y2="205" marker-end="url(#ah-red)"/>
    <line x1="395" y1="235" x2="75" y2="235" marker-end="url(#ah-red)"/>
    <line x1="395" y1="265" x2="75" y2="265" marker-end="url(#ah-red)"/>
  </g>
  <text x="235" y="168" font-size="17" font-weight="bold" fill="#c53030" text-anchor="middle">Radiation</text>
  <text x="235" y="188" font-size="14" fill="#4a5568" text-anchor="middle">to walls and windows</text>

  <!-- convection to the air -->
  <g stroke="#c53030" stroke-width="3" fill="none">
    <path d="M482 150 q15 -10 30 0 t30 0 t30 0 t30 0" marker-end="url(#ah-red)"/>
    <path d="M482 182 q15 -10 30 0 t30 0 t30 0 t30 0" marker-end="url(#ah-red)"/>
  </g>
  <text x="640" y="160" font-size="17" font-weight="bold" fill="#c53030">Convection</text>
  <text x="640" y="180" font-size="14" fill="#4a5568">to the surrounding air</text>

  <!-- evaporation -->
  <g stroke="#2b6cb0" stroke-width="3" fill="none">
    <line x1="535" y1="235" x2="625" y2="235" stroke-dasharray="2 8" stroke-linecap="round" marker-end="url(#ah-blue)"/>
    <line x1="545" y1="265" x2="625" y2="265" stroke-dasharray="2 8" stroke-linecap="round" marker-end="url(#ah-blue)"/>
  </g>
  <text x="640" y="245" font-size="17" font-weight="bold" fill="#2b6cb0">Evaporation</text>
  <text x="640" y="265" font-size="14" fill="#4a5568">sweat and breathing</text>

  <!-- conduction -->
  <g stroke="#c53030" stroke-width="3" fill="none">
    <line x1="455" y1="297" x2="455" y2="346" marker-end="url(#ah-red)"/>
    <line x1="500" y1="297" x2="500" y2="346" marker-end="url(#ah-red)"/>
    <line x1="525" y1="357" x2="525" y2="357"/>
  </g>
  <text x="478" y="388" font-size="17" font-weight="bold" fill="#c53030" text-anchor="middle">Conduction</text>
  <text x="478" y="408" font-size="14" fill="#4a5568" text-anchor="middle">to the chair and the floor</text>

  <!-- legend and caption -->
  <circle cx="60" cy="440" r="11" fill="#fed7d7" stroke="#c53030" stroke-width="2.5"/>
  <text x="60" y="445" font-size="13" font-weight="bold" fill="#9b2c2c" text-anchor="middle">M</text>
  <text x="80" y="446" font-size="15" fill="#4a5568">metabolic heat produced inside the body</text>
  <rect x="215" y="458" width="470" height="36" rx="8" fill="#f0fff4" stroke="#2f855a" stroke-width="2"/>
  <text x="450" y="482" font-size="18" font-weight="bold" fill="#276749" text-anchor="middle">comfort = heat produced equals heat lost</text>
</svg>
