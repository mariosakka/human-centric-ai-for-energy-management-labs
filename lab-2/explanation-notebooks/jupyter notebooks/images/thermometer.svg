<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4a5568"/></marker>
    <marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c53030"/></marker>
  </defs>
  <rect width="900" height="400" fill="#ffffff"/>
  <text x="450" y="34" font-size="22" font-weight="bold" fill="#1a202c" text-anchor="middle">Thermometer: the liquid expands when it is warmer</text>

  <!-- glass tube -->
  <rect x="425" y="66" width="30" height="236" rx="15" fill="#ffffff" stroke="#4a5568" stroke-width="3.5"/>
  <!-- liquid column up to 24 C -->
  <rect x="433" y="170" width="14" height="140" fill="#c53030"/>
  <!-- bulb -->
  <circle cx="440" cy="322" r="30" fill="#c53030" stroke="#4a5568" stroke-width="3.5"/>
  <rect x="425" y="300" width="30" height="12" fill="#c53030"/>
  <!-- scale ticks and numbers -->
  <g stroke="#4a5568" stroke-width="2.5">
    <line x1="462" y1="90" x2="478" y2="90"/><line x1="462" y1="130" x2="478" y2="130"/><line x1="462" y1="170" x2="478" y2="170"/>
    <line x1="462" y1="210" x2="478" y2="210"/><line x1="462" y1="250" x2="478" y2="250"/><line x1="462" y1="290" x2="478" y2="290"/>
  </g>
  <g font-size="15" fill="#4a5568">
    <text x="486" y="95">40</text><text x="486" y="135">32</text><text x="486" y="175" font-weight="bold" fill="#c53030">24</text>
    <text x="486" y="215">16</text><text x="486" y="255">8</text><text x="486" y="295">0</text>
  </g>
  <text x="520" y="175" font-size="15" fill="#4a5568">°C</text>

  <!-- labels on the left -->
  <g stroke="#4a5568" stroke-width="2" fill="none">
    <line x1="260" y1="100" x2="420" y2="100" marker-end="url(#ah)"/>
    <line x1="260" y1="200" x2="428" y2="200" marker-end="url(#ah)"/>
    <line x1="260" y1="330" x2="404" y2="330" marker-end="url(#ah)"/>
  </g>
  <text x="250" y="96" font-size="16" font-weight="bold" fill="#1a202c" text-anchor="end">Glass tube</text>
  <text x="250" y="116" font-size="14" fill="#4a5568" text-anchor="end">thin and sealed</text>
  <text x="250" y="196" font-size="16" font-weight="bold" fill="#1a202c" text-anchor="end">Liquid column</text>
  <text x="250" y="216" font-size="14" fill="#4a5568" text-anchor="end">alcohol or mercury</text>
  <text x="250" y="326" font-size="16" font-weight="bold" fill="#1a202c" text-anchor="end">Bulb</text>
  <text x="250" y="346" font-size="14" fill="#4a5568" text-anchor="end">touches the air</text>

  <!-- principle on the right -->
  <rect x="590" y="110" width="270" height="170" rx="10" fill="#fffaf0" stroke="#a0aec0" stroke-width="2"/>
  <text x="725" y="140" font-size="16" font-weight="bold" fill="#c53030" text-anchor="middle">How it measures</text>
  <text x="725" y="172" font-size="14" fill="#4a5568" text-anchor="middle">1. Warm air heats the bulb.</text>
  <text x="725" y="196" font-size="14" fill="#4a5568" text-anchor="middle">2. The liquid expands</text>
  <text x="725" y="216" font-size="14" fill="#4a5568" text-anchor="middle">and climbs the tube.</text>
  <text x="725" y="240" font-size="14" fill="#4a5568" text-anchor="middle">3. Read the height on the scale:</text>
  <text x="725" y="266" font-size="17" font-weight="bold" fill="#c53030" text-anchor="middle">24 °C: the air temperature</text>
  <line x1="590" y1="190" x2="520" y2="190" stroke="#c53030" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#ah-red)"/>

  <text x="450" y="384" font-size="15" fill="#4a5568" text-anchor="middle">It reads the temperature of the air around the bulb, nothing else (not the walls, not the humidity).</text>
</svg>
