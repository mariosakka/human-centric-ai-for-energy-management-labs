<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Arial, Helvetica, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c53030"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b6cb0"/></marker></defs><rect width="900" height="500" fill="#fff"/><text x="450" y="34" font-size="22" text-anchor="middle" fill="#1a202c" font-weight="bold">Specific heat: warming 84 kg by 1 K</text><rect x="70" y="100" width="320" height="150" rx="12" fill="#bee3f8" stroke="#2b6cb0" stroke-width="3"/><text x="230" y="135" font-size="20" text-anchor="middle" fill="#2b6cb0" font-weight="bold">84 kg of room air</text><text x="230" y="165" font-size="17" text-anchor="middle" fill="#4a5568" font-weight="normal">c = 1.005 kJ/(kg·K)</text><text x="230" y="200" font-size="17" text-anchor="middle" fill="#4a5568" font-weight="normal">+1 K needs</text><text x="230" y="230" font-size="24" text-anchor="middle" fill="#2b6cb0" font-weight="bold">84.6 kJ</text><rect x="510" y="100" width="320" height="150" rx="12" fill="#fed7d7" stroke="#c53030" stroke-width="3"/><text x="670" y="135" font-size="20" text-anchor="middle" fill="#c53030" font-weight="bold">84 kg of water</text><text x="670" y="165" font-size="17" text-anchor="middle" fill="#4a5568" font-weight="normal">c = 4.19 kJ/(kg·K)</text><text x="670" y="200" font-size="17" text-anchor="middle" fill="#4a5568" font-weight="normal">+1 K needs</text><text x="670" y="230" font-size="24" text-anchor="middle" fill="#c53030" font-weight="bold">352.5 kJ</text><line x1="395" y1="175" x2="505" y2="175" stroke="#4a5568" stroke-width="3" marker-end="url(#a)"/><text x="450" y="160" font-size="22" text-anchor="middle" fill="#4a5568" font-weight="bold">× 4.2</text><text x="70" y="300" font-size="16" text-anchor="start" fill="#4a5568" font-weight="normal">energy to warm by 1 K [kJ]</text><rect x="70" y="315" width="182" height="34" fill="#2b6cb0"/><text x="262.4" y="339" font-size="16" text-anchor="start" fill="#2b6cb0" font-weight="bold">84.6</text><rect x="70" y="360" width="760" height="34" fill="#c53030"/><text x="822" y="385" font-size="16" text-anchor="end" fill="#fff" font-weight="bold">352.5</text><text x="450" y="440" font-size="17" text-anchor="middle" fill="#1a202c" font-weight="normal">Water stores about 4 times more heat than air for the same mass:</text><text x="450" y="468" font-size="17" text-anchor="middle" fill="#4a5568" font-weight="normal">that is why air heats and cools quickly, and why a water-filled radiator is a good heat carrier.</text></svg>