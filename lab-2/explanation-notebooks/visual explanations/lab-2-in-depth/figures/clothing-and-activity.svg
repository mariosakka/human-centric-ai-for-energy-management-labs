<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Arial, Helvetica, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c53030"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b6cb0"/></marker></defs><rect width="900" height="500" fill="#fff"/><text x="450" y="34" font-size="22" text-anchor="middle" fill="#1a202c" font-weight="bold">The two personal factors: clothing (clo) and activity (met)</text><text x="70" y="90" font-size="20" text-anchor="start" fill="#2b6cb0" font-weight="bold">Clothing insulation [clo]</text><rect x="80" y="160" width="740" height="14" rx="7" fill="#bee3f8" stroke="#2b6cb0"/><circle cx="265.0" cy="167" r="9" fill="#2b6cb0" stroke="none"/><text x="265.0" y="138" font-size="18" text-anchor="middle" fill="#2b6cb0" font-weight="bold">0.5</text><text x="265.0" y="120" font-size="14" text-anchor="middle" fill="#4a5568" font-weight="normal">summer office</text><circle cx="339.0" cy="167" r="9" fill="#2b6cb0" stroke="none"/><text x="339.0" y="208" font-size="18" text-anchor="middle" fill="#2b6cb0" font-weight="bold">0.7</text><text x="339.0" y="228" font-size="14" text-anchor="middle" fill="#4a5568" font-weight="normal">spring / autumn</text><circle cx="450.0" cy="167" r="9" fill="#2b6cb0" stroke="none"/><text x="450.0" y="138" font-size="18" text-anchor="middle" fill="#2b6cb0" font-weight="bold">1.0</text><text x="450.0" y="120" font-size="14" text-anchor="middle" fill="#4a5568" font-weight="normal">winter, indoors</text><circle cx="635.0" cy="167" r="9" fill="#2b6cb0" stroke="none"/><text x="635.0" y="208" font-size="18" text-anchor="middle" fill="#2b6cb0" font-weight="bold">1.5</text><text x="635.0" y="228" font-size="14" text-anchor="middle" fill="#4a5568" font-weight="normal">heavy winter clothes</text><text x="70" y="290" font-size="20" text-anchor="start" fill="#c53030" font-weight="bold">Metabolic rate [met]</text><rect x="80" y="360" width="740" height="14" rx="7" fill="#fed7d7" stroke="#c53030"/><circle cx="154.0" cy="367" r="9" fill="#c53030" stroke="none"/><text x="154.0" y="338" font-size="18" text-anchor="middle" fill="#c53030" font-weight="bold">0.7</text><text x="154.0" y="320" font-size="14" text-anchor="middle" fill="#4a5568" font-weight="normal">sleeping</text><circle cx="265.0" cy="367" r="9" fill="#c53030" stroke="none"/><text x="265.0" y="408" font-size="18" text-anchor="middle" fill="#c53030" font-weight="bold">1.0</text><text x="265.0" y="428" font-size="14" text-anchor="middle" fill="#4a5568" font-weight="normal">seated, quiet</text><circle cx="339.0" cy="367" r="9" fill="#c53030" stroke="none"/><text x="339.0" y="338" font-size="18" text-anchor="middle" fill="#c53030" font-weight="bold">1.2</text><text x="339.0" y="320" font-size="14" text-anchor="middle" fill="#4a5568" font-weight="normal">office work</text><circle cx="487.00000000000006" cy="367" r="9" fill="#c53030" stroke="none"/><text x="487.00000000000006" y="408" font-size="18" text-anchor="middle" fill="#c53030" font-weight="bold">1.6</text><text x="487.00000000000006" y="428" font-size="14" text-anchor="middle" fill="#4a5568" font-weight="normal">standing, light work</text><circle cx="635.0" cy="367" r="9" fill="#c53030" stroke="none"/><text x="635.0" y="338" font-size="18" text-anchor="middle" fill="#c53030" font-weight="bold">2.0</text><text x="635.0" y="320" font-size="14" text-anchor="middle" fill="#4a5568" font-weight="normal">slow walking</text><text x="450" y="470" font-size="16" text-anchor="middle" fill="#2f855a" font-weight="bold">More clo or more met means more heat kept or made: the same room feels warmer.</text></svg>