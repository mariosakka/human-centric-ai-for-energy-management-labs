<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4a5568"/></marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2b6cb0"/></marker>
  </defs>
  <rect width="1000" height="420" fill="#ffffff"/>
  <text x="500" y="34" font-size="22" font-weight="bold" fill="#1a202c" text-anchor="middle">Hygrometer: a humidity-sensitive element moves a needle</text>

  <!-- case -->
  <rect x="350" y="70" width="420" height="250" rx="14" fill="#f7fafc" stroke="#4a5568" stroke-width="3.5"/>

  <!-- dial: half circle, centre (620,250), radius 120; 0 % left, 100 % right -->
  <path d="M500 250 A120 120 0 0 1 740 250" fill="#ffffff" stroke="#4a5568" stroke-width="3"/>
  <line x1="500" y1="250" x2="740" y2="250" stroke="#4a5568" stroke-width="3"/>
  <g stroke="#4a5568" stroke-width="2.5">
    <line x1="500" y1="250" x2="518" y2="250"/>
    <line x1="535" y1="165" x2="549" y2="176"/>
    <line x1="620" y1="130" x2="620" y2="148"/>
    <line x1="705" y1="165" x2="691" y2="176"/>
    <line x1="740" y1="250" x2="722" y2="250"/>
  </g>
  <g font-size="14" fill="#4a5568" text-anchor="middle">
    <text x="518" y="272">0</text><text x="560" y="198">25</text><text x="620" y="172">50</text><text x="680" y="198">75</text><text x="722" y="272">100</text>
  </g>
  <text x="620" y="300" font-size="14" fill="#4a5568" text-anchor="middle">relative humidity RH [%]</text>
  <!-- needle at 60 % -->
  <line x1="620" y1="250" x2="657" y2="145" stroke="#c53030" stroke-width="4.5" stroke-linecap="round"/>
  <circle cx="620" cy="250" r="9" fill="#4a5568"/>

  <!-- sensing element: two wavy strips -->
  <path d="M362 150 q18 -18 36 0 t36 0 t36 0" fill="none" stroke="#2b6cb0" stroke-width="5" stroke-linecap="round"/>
  <path d="M362 178 q18 -18 36 0 t36 0 t36 0" fill="none" stroke="#2b6cb0" stroke-width="5" stroke-linecap="round"/>
  <!-- lever from the element to the needle pivot -->
  <line x1="470" y1="164" x2="620" y2="250" stroke="#718096" stroke-width="3.5"/>

  <!-- humid air entering -->
  <g stroke="#2b6cb0" stroke-width="2.5" fill="none">
    <line x1="150" y1="150" x2="346" y2="150" marker-end="url(#ah-blue)"/>
    <line x1="150" y1="178" x2="346" y2="178" marker-end="url(#ah-blue)"/>
  </g>
  <g fill="#2b6cb0"><circle cx="190" cy="136" r="4"/><circle cx="240" cy="164" r="4"/><circle cx="215" cy="192" r="4"/><circle cx="290" cy="138" r="4"/></g>
  <text x="130" y="118" font-size="15" font-weight="bold" fill="#2b6cb0">Room air with water vapour</text>

  <!-- leader lines -->
  <g stroke="#4a5568" stroke-width="2" fill="none">
    <line x1="250" y1="262" x2="400" y2="196" marker-end="url(#ah)"/>
    <line x1="480" y1="352" x2="480" y2="172" marker-end="url(#ah)"/>
    <line x1="800" y1="232" x2="640" y2="232" marker-end="url(#ah)"/>
  </g>
  <text x="246" y="268" font-size="16" font-weight="bold" fill="#1a202c" text-anchor="end">Sensing element</text>
  <text x="246" y="288" font-size="14" fill="#4a5568" text-anchor="end">hair or polymer strip:</text>
  <text x="246" y="306" font-size="14" fill="#4a5568" text-anchor="end">swells in humid air,</text>
  <text x="246" y="324" font-size="14" fill="#4a5568" text-anchor="end">shrinks in dry air</text>
  <text x="480" y="376" font-size="16" font-weight="bold" fill="#1a202c" text-anchor="middle">Lever</text>
  <text x="480" y="396" font-size="14" fill="#4a5568" text-anchor="middle">turns the swelling into a turn of the needle</text>
  <text x="810" y="228" font-size="16" font-weight="bold" fill="#1a202c">Needle and dial</text>
  <text x="810" y="248" font-size="14" fill="#4a5568">here RH = 60 %</text>

  <rect x="790" y="270" width="190" height="76" rx="10" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="2"/>
  <text x="885" y="296" font-size="14" font-weight="bold" fill="#2b6cb0" text-anchor="middle">What it responds to</text>
  <text x="885" y="318" font-size="14" fill="#4a5568" text-anchor="middle">the water vapour in the air</text>
  <text x="885" y="336" font-size="14" fill="#4a5568" text-anchor="middle">(p_v relative to p_sat)</text>
</svg>
