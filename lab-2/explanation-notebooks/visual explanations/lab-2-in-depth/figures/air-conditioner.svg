<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4a5568"/></marker>
    <marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c53030"/></marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2b6cb0"/></marker>
  </defs>
  <rect width="900" height="460" fill="#ffffff"/>
  <text x="450" y="34" font-size="22" font-weight="bold" fill="#1a202c" text-anchor="middle">Air conditioner: a cold coil cools the air and makes the water drip out</text>

  <!-- casing -->
  <rect x="190" y="100" width="520" height="210" rx="10" fill="#f7fafc" stroke="#4a5568" stroke-width="3.5"/>

  <!-- fan -->
  <circle cx="260" cy="205" r="40" fill="#ffffff" stroke="#4a5568" stroke-width="3"/>
  <g stroke="#4a5568" stroke-width="5" stroke-linecap="round">
    <line x1="260" y1="205" x2="260" y2="175"/><line x1="260" y1="205" x2="286" y2="220"/><line x1="260" y1="205" x2="234" y2="220"/>
  </g>
  <circle cx="260" cy="205" r="5" fill="#4a5568"/>

  <!-- cold coil: zigzag pipe with fins -->
  <g stroke="#a0aec0" stroke-width="3">
    <line x1="400" y1="125" x2="400" y2="285"/><line x1="430" y1="125" x2="430" y2="285"/><line x1="460" y1="125" x2="460" y2="285"/>
    <line x1="490" y1="125" x2="490" y2="285"/><line x1="520" y1="125" x2="520" y2="285"/><line x1="550" y1="125" x2="550" y2="285"/>
  </g>
  <path d="M385 140 H565 M565 140 V180 H385 M385 180 V220 H565 M565 220 V260 H385" fill="none" stroke="#2b6cb0" stroke-width="7" stroke-linejoin="round"/>

  <!-- water drops on the coil falling into the tray -->
  <g fill="#2b6cb0"><circle cx="415" cy="298" r="5"/><circle cx="470" cy="302" r="5"/><circle cx="525" cy="297" r="5"/><circle cx="560" cy="303" r="5"/></g>
  <path d="M370 312 H580 V334 Q580 342 572 342 H378 Q370 342 370 334 Z" fill="#bee3f8" stroke="#2b6cb0" stroke-width="3"/>
  <line x1="580" y1="328" x2="760" y2="328" stroke="#2b6cb0" stroke-width="3" marker-end="url(#ah-blue)"/>
  <text x="770" y="333" font-size="15" font-weight="bold" fill="#2b6cb0">water out</text>

  <!-- warm humid air in -->
  <line x1="40" y1="205" x2="215" y2="205" stroke="#c53030" stroke-width="5" marker-end="url(#ah-red)"/>
  <text x="40" y="150" font-size="16" font-weight="bold" fill="#c53030">Warm, humid air in</text>
  <text x="40" y="172" font-size="14" fill="#4a5568">30 °C, RH 60 %</text>
  <text x="40" y="192" font-size="14" fill="#4a5568">16.3 g water / kg air</text>

  <!-- cool dry air out -->
  <line x1="710" y1="205" x2="860" y2="205" stroke="#2b6cb0" stroke-width="5" marker-end="url(#ah-blue)"/>
  <text x="780" y="150" font-size="16" font-weight="bold" fill="#2b6cb0" text-anchor="middle">Cool, drier air out</text>
  <text x="780" y="172" font-size="14" fill="#4a5568" text-anchor="middle">15 °C, RH 100 %</text>
  <text x="780" y="192" font-size="14" fill="#4a5568" text-anchor="middle">10.8 g water / kg air</text>

  <!-- part labels -->
  <g stroke="#4a5568" stroke-width="2" fill="none">
    <line x1="260" y1="85" x2="260" y2="160" marker-end="url(#ah)"/>
    <line x1="475" y1="85" x2="475" y2="122" marker-end="url(#ah)"/>
    <line x1="300" y1="400" x2="395" y2="340" marker-end="url(#ah)"/>
  </g>
  <text x="260" y="76" font-size="16" font-weight="bold" fill="#1a202c" text-anchor="middle">Fan</text>
  <text x="475" y="68" font-size="16" font-weight="bold" fill="#1a202c" text-anchor="middle">Cold coil</text>
    <text x="296" y="418" font-size="16" font-weight="bold" fill="#1a202c" text-anchor="end">Drip tray</text>
  <text x="296" y="438" font-size="14" fill="#4a5568" text-anchor="end">collects the water</text>

  <!-- principle -->
  <rect x="400" y="372" width="490" height="68" rx="10" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="2"/>
  <text x="645" y="396" font-size="14" fill="#4a5568" text-anchor="middle">The coil is colder than the dew point (21.4 °C), so vapour condenses on it.</text>
  <text x="645" y="418" font-size="14" font-weight="bold" fill="#2b6cb0" text-anchor="middle">5.4 g of water leave every kg of air: cooled and dried.</text>
</svg>
