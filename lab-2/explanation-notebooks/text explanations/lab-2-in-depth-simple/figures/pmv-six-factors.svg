<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2b6cb0"/></marker>
    <marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2f855a"/></marker>
    <marker id="ah-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4a5568"/></marker>
    <g id="person" fill="none" stroke="#4a5568" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="415,200 415,288 535,288" stroke="#a0aec0" stroke-width="4"/>
      <line x1="420" y1="288" x2="420" y2="360" stroke="#a0aec0" stroke-width="4"/>
      <line x1="530" y1="288" x2="530" y2="360" stroke="#a0aec0" stroke-width="4"/>
      <circle cx="440" cy="150" r="26" fill="#ffffff"/>
      <line x1="440" y1="176" x2="440" y2="280"/>
      <polyline points="440,280 520,280 520,350"/>
      <polyline points="440,200 485,240 510,250"/>
    </g>
  </defs>
  <rect width="900" height="500" fill="#ffffff"/>

  <!-- the person -->
  <ellipse cx="505" cy="275" rx="115" ry="140" fill="#f7fafc" stroke="#a0aec0" stroke-width="2" stroke-dasharray="6 5"/>
  <use href="#person" transform="translate(30,35)"/>
  <line x1="420" y1="395" x2="600" y2="395" stroke="#a0aec0" stroke-width="3"/>

  <!-- environment factors (blue) -->
  <g font-size="16" fill="#1a365d">
    <rect x="30" y="24" width="220" height="52" rx="8" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="2"/>
    <text x="42" y="46" font-weight="bold">Air temperature t_a</text><text x="42" y="66" font-size="14" fill="#4a5568">how warm the air is</text>
    <rect x="30" y="94" width="220" height="52" rx="8" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="2"/>
    <text x="42" y="116" font-weight="bold">Radiant temp. t_mr</text><text x="42" y="136" font-size="14" fill="#4a5568">how warm the surfaces are</text>
    <rect x="30" y="164" width="220" height="52" rx="8" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="2"/>
    <text x="42" y="186" font-weight="bold">Air speed v</text><text x="42" y="206" font-size="14" fill="#4a5568">draught or fan, in m/s</text>
    <rect x="30" y="234" width="220" height="52" rx="8" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="2"/>
    <text x="42" y="256" font-weight="bold">Humidity RH</text><text x="42" y="276" font-size="14" fill="#4a5568">water vapour in the air, %</text>
  </g>
  <!-- personal factors (green) -->
  <g font-size="16" fill="#1c4532">
    <rect x="30" y="304" width="220" height="52" rx="8" fill="#f0fff4" stroke="#2f855a" stroke-width="2"/>
    <text x="42" y="326" font-weight="bold">Clothing clo</text><text x="42" y="346" font-size="14" fill="#4a5568">insulation of the clothes</text>
    <rect x="30" y="374" width="220" height="52" rx="8" fill="#f0fff4" stroke="#2f855a" stroke-width="2"/>
    <text x="42" y="396" font-weight="bold">Activity met</text><text x="42" y="416" font-size="14" fill="#4a5568">heat the body produces</text>
  </g>

  <!-- arms: factor -> person -->
  <g fill="none" stroke-width="2.5">
    <line x1="250" y1="50" x2="412" y2="190" stroke="#2b6cb0" marker-end="url(#ah-blue)"/>
    <line x1="250" y1="120" x2="397" y2="225" stroke="#2b6cb0" marker-end="url(#ah-blue)"/>
    <line x1="250" y1="190" x2="390" y2="260" stroke="#2b6cb0" marker-end="url(#ah-blue)"/>
    <line x1="250" y1="260" x2="390" y2="295" stroke="#2b6cb0" marker-end="url(#ah-blue)"/>
    <line x1="250" y1="330" x2="397" y2="330" stroke="#2f855a" marker-end="url(#ah-green)"/>
    <line x1="250" y1="400" x2="412" y2="360" stroke="#2f855a" marker-end="url(#ah-green)"/>
  </g>

  <!-- result box -->
  <line x1="622" y1="275" x2="680" y2="275" stroke="#4a5568" stroke-width="4" marker-end="url(#ah-grey)"/>
  <rect x="685" y="225" width="190" height="100" rx="10" fill="#fffaf0" stroke="#4a5568" stroke-width="2.5"/>
  <text x="780" y="262" font-size="22" font-weight="bold" fill="#1a202c" text-anchor="middle">PMV and PPD</text>
  <text x="780" y="286" font-size="14" fill="#4a5568" text-anchor="middle">comfort vote and</text>
  <text x="780" y="304" font-size="14" fill="#4a5568" text-anchor="middle">% of unhappy people</text>

  <!-- legend -->
  <rect x="300" y="450" width="16" height="16" rx="3" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="2"/>
  <text x="324" y="464" font-size="15" fill="#4a5568">environment (the room)</text>
  <rect x="540" y="450" width="16" height="16" rx="3" fill="#f0fff4" stroke="#2f855a" stroke-width="2"/>
  <text x="564" y="464" font-size="15" fill="#4a5568">personal (the occupant)</text>
  <text x="450" y="490" font-size="15" font-weight="bold" fill="#4a5568" text-anchor="middle">Six factors decide thermal comfort, not the thermostat alone</text>
</svg>
