<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" font-family="Segoe UI, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#c53030"/></marker>
    <marker id="ao" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#c05621"/></marker>
  </defs>
  <rect width="900" height="500" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#4a5568">The three ways heat moves</text>

  <!-- panels -->
  <g fill="#f7fafc" stroke="#a0aec0">
    <rect x="20" y="48" width="270" height="370" rx="10"/>
    <rect x="315" y="48" width="270" height="370" rx="10"/>
    <rect x="610" y="48" width="270" height="370" rx="10"/>
  </g>
  <g text-anchor="middle" font-size="17" font-weight="bold" fill="#2d3748">
    <text x="155" y="78">Conduction</text><text x="450" y="78">Convection</text><text x="745" y="78">Radiation</text>
  </g>

  <!-- 1 conduction -->
  <rect x="85" y="110" width="140" height="120" fill="#e2e8f0" stroke="#4a5568" stroke-width="2"/>
  <rect x="85" y="110" width="30" height="120" fill="#fed7d7" stroke="#4a5568" stroke-width="2"/>
  <rect x="195" y="110" width="30" height="120" fill="#bee3f8" stroke="#4a5568" stroke-width="2"/>
  <g stroke="#c53030" stroke-width="3" marker-end="url(#ar)">
    <line x1="95" y1="140" x2="212" y2="140"/><line x1="95" y1="170" x2="212" y2="170"/><line x1="95" y1="200" x2="212" y2="200"/>
  </g>
  <text x="100" y="250" text-anchor="middle" fill="#c53030">hot</text>
  <text x="210" y="250" text-anchor="middle" fill="#2b6cb0">cold</text>

  <!-- 2 convection -->
  <rect x="360" y="105" width="30" height="135" fill="#fed7d7" stroke="#4a5568" stroke-width="2"/>
  <text x="375" y="258" text-anchor="middle" fill="#c53030">warm surface</text>
  <g fill="none" stroke="#c53030" stroke-width="3" marker-end="url(#ar)">
    <path d="M400,225 C450,215 470,170 430,140"/>
    <path d="M400,195 C445,185 480,150 455,118"/>
  </g>
  <path d="M475,215 C505,205 520,170 500,135" fill="none" stroke="#c53030" stroke-width="3" marker-end="url(#ar)"/>
  <text x="515" y="240" text-anchor="middle" fill="#4a5568">moving air</text>

  <!-- 3 radiation -->
  <circle cx="650" cy="165" r="22" fill="#ed8936" stroke="#c05621" stroke-width="2"/>
  <g fill="none" stroke="#c05621" stroke-width="3" marker-end="url(#ao)">
    <path d="M680,125 q12,-10 24,0 t24,0 t24,0 t20,0"/>
    <path d="M684,165 q12,-10 24,0 t24,0 t24,0 t20,0"/>
    <path d="M680,205 q12,-10 24,0 t24,0 t24,0 t20,0"/>
  </g>
  <rect x="845" y="105" width="18" height="135" fill="#a0aec0" stroke="#4a5568" stroke-width="2"/>
  <text x="745" y="258" text-anchor="middle" fill="#c05621">sun or hot surface</text>

  <!-- definitions -->
  <g fill="#2d3748">
    <text x="36" y="292">Heat passes through a solid,</text>
    <text x="36" y="312">from particle to particle.</text>
    <text x="36" y="340" font-weight="bold">λ [W/mK]</text>
    <text x="36" y="360">conductivity of the material:</text>
    <text x="36" y="380">small λ = good insulator.</text>
    <text x="36" y="404" fill="#4a5568">Used in δ/λ of each layer</text>

    <text x="331" y="292">Moving air carries heat to or</text>
    <text x="331" y="312">from a surface.</text>
    <text x="331" y="340" font-weight="bold">α [W/m²K]</text>
    <text x="331" y="360">surface coefficient: larger</text>
    <text x="331" y="380">when the air moves faster.</text>
    <text x="331" y="404" fill="#4a5568">Used in 1/α_E and 1/α_I</text>

    <text x="626" y="292">Heat travels as light and</text>
    <text x="626" y="312">infrared, no material needed.</text>
    <text x="626" y="340" font-weight="bold">I_T [W/m²]</text>
    <text x="626" y="360">solar power falling on 1 m²</text>
    <text x="626" y="380">of the facade.</text>
    <text x="626" y="404" fill="#4a5568">Used in the window solar gain</text>
  </g>
  <text x="450" y="455" text-anchor="middle" fill="#4a5568">The wall's k-value combines them: convection at both surfaces (α) and conduction in the layers (δ/λ)</text>
</svg>
