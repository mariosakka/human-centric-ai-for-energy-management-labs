<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" font-family="Segoe UI, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#c53030"/></marker>
    <marker id="ab" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#2b6cb0"/></marker>
    <marker id="ag" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#4a5568"/></marker>
  </defs>
  <rect width="900" height="460" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#4a5568">Thermostat: a thermometer and a switch that compares the room with the setpoint</text>

  <!-- the device on the wall -->
  <rect x="20" y="50" width="30" height="380" fill="#a0aec0" stroke="#4a5568"/>
  <rect x="50" y="130" width="200" height="220" rx="14" fill="#edf2f7" stroke="#4a5568" stroke-width="3"/>
  <circle cx="150" cy="215" r="52" fill="#ffffff" stroke="#4a5568" stroke-width="3"/>
  <line x1="150" y1="215" x2="178" y2="182" stroke="#c53030" stroke-width="5" stroke-linecap="round"/>
  <text x="150" y="222" text-anchor="middle" font-size="12" fill="#4a5568"> </text>
  <rect x="100" y="288" width="100" height="36" rx="6" fill="#1a202c"/>
  <text x="150" y="313" text-anchor="middle" font-size="20" font-weight="bold" fill="#68d391">21.5 °C</text>
  <text x="150" y="152" text-anchor="middle" font-weight="bold" fill="#4a5568">dial: setpoint</text>
  <text x="150" y="372" text-anchor="middle" fill="#4a5568" font-weight="bold">thermostat on the wall</text>
  <!-- sensor slots -->
  <g stroke="#4a5568" stroke-width="2"><line x1="70" y1="338" x2="90" y2="338"/><line x1="70" y1="330" x2="90" y2="330"/><line x1="210" y1="338" x2="230" y2="338"/><line x1="210" y1="330" x2="230" y2="330"/></g>
  <text x="60" y="400" fill="#2b6cb0">slots let room air</text>
  <text x="60" y="418" fill="#2b6cb0">reach the sensor</text>

  <!-- logic -->
  <rect x="340" y="110" width="250" height="260" rx="8" fill="#f7fafc" stroke="#a0aec0"/>
  <text x="465" y="136" text-anchor="middle" font-weight="bold" fill="#4a5568">Inside the box</text>
  <rect x="360" y="152" width="210" height="50" rx="6" fill="#ebf4fb" stroke="#2b6cb0"/>
  <text x="465" y="174" text-anchor="middle" fill="#2b6cb0" font-weight="bold">1. sensor</text>
  <text x="465" y="192" text-anchor="middle" fill="#2b6cb0">measures the air t_a</text>
  <rect x="360" y="226" width="210" height="50" rx="6" fill="#fffaf0" stroke="#c05621"/>
  <text x="465" y="248" text-anchor="middle" fill="#c05621" font-weight="bold">2. comparison</text>
  <text x="465" y="266" text-anchor="middle" fill="#c05621">t_a against the setpoint</text>
  <rect x="360" y="300" width="210" height="50" rx="6" fill="#fdecec" stroke="#c53030"/>
  <text x="465" y="322" text-anchor="middle" fill="#c53030" font-weight="bold">3. switch</text>
  <text x="465" y="340" text-anchor="middle" fill="#c53030">heating ON or OFF</text>
  <line x1="465" y1="202" x2="465" y2="224" stroke="#4a5568" stroke-width="3" marker-end="url(#ag)"/>
  <line x1="465" y1="276" x2="465" y2="298" stroke="#4a5568" stroke-width="3" marker-end="url(#ag)"/>
  <line x1="250" y1="215" x2="358" y2="177" stroke="#2b6cb0" stroke-width="3" marker-end="url(#ab)"/>

  <!-- rule panel -->
  <rect x="640" y="110" width="245" height="260" rx="8" fill="#ffffff" stroke="#a0aec0"/>
  <text x="652" y="136" font-weight="bold" fill="#4a5568">The rule (heating)</text>
  <text x="652" y="166" fill="#2b6cb0" font-weight="bold">room colder than setpoint</text>
  <text x="652" y="186" fill="#c53030">→ heater ON</text>
  <text x="652" y="226" fill="#2b6cb0" font-weight="bold">room warm enough</text>
  <text x="652" y="246" fill="#c53030">→ heater OFF</text>
  <text x="652" y="286" fill="#4a5568">A fridge or an oven</text>
  <text x="652" y="306" fill="#4a5568">uses the same logic.</text>
  <line x1="590" y1="325" x2="638" y2="325" stroke="#c53030" stroke-width="3" marker-end="url(#ar)"/>
</svg>
