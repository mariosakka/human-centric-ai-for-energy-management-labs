<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" font-family="Segoe UI, Arial, sans-serif" font-size="14">
  <rect width="900" height="500" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#4a5568">Thermal conductivity of the sheet's materials (logarithmic scale)</text>

  <!-- zones -->
  <rect x="60"  y="60" width="143" height="250" fill="#ebf4fb"/>
  <rect x="311" y="60" width="358" height="250" fill="#f1f3f6"/>
  <rect x="669" y="60" width="171" height="250" fill="#fdecec"/>
  <text x="131" y="82" text-anchor="middle" fill="#2b6cb0" font-weight="bold">Insulators</text>
  <text x="131" y="100" text-anchor="middle" fill="#2b6cb0">λ below 0.05</text>
  <text x="490" y="82" text-anchor="middle" fill="#4a5568" font-weight="bold">Masonry and plaster</text>
  <text x="490" y="100" text-anchor="middle" fill="#4a5568">λ from 0.1 to 1</text>
  <text x="754" y="82" text-anchor="middle" fill="#c53030" font-weight="bold">Heavy, conducts well</text>
  <text x="754" y="100" text-anchor="middle" fill="#c53030">λ above 1</text>

  <!-- axis -->
  <line x1="60" y1="250" x2="840" y2="250" stroke="#4a5568" stroke-width="3"/>
  <g stroke="#4a5568" stroke-width="2">
    <line x1="60" y1="244" x2="60" y2="256"/><line x1="203" y1="244" x2="203" y2="256"/><line x1="311" y1="244" x2="311" y2="256"/>
    <line x1="418" y1="244" x2="418" y2="256"/><line x1="561" y1="244" x2="561" y2="256"/><line x1="669" y1="244" x2="669" y2="256"/>
    <line x1="777" y1="244" x2="777" y2="256"/>
  </g>
  <g text-anchor="middle" fill="#4a5568">
    <text x="60" y="276">0.02</text><text x="203" y="276">0.05</text><text x="311" y="276">0.1</text><text x="418" y="276">0.2</text>
    <text x="561" y="276">0.5</text><text x="669" y="276">1</text><text x="777" y="276">2</text>
  </g>

  <!-- leaders -->
  <g stroke="#a0aec0">
    <line x1="95" y1="222" x2="95" y2="243"/>
    <line x1="168" y1="172" x2="168" y2="243"/>
    <line x1="151" y1="257" x2="151" y2="296"/>
    <line x1="374" y1="222" x2="374" y2="243"/>
    <line x1="506" y1="222" x2="506" y2="243"/>
    <line x1="613" y1="222" x2="613" y2="243"/>
    <line x1="634" y1="257" x2="634" y2="296"/>
    <line x1="779" y1="222" x2="779" y2="243"/>
  </g>
  <!-- markers -->
  <g stroke="#ffffff" stroke-width="2">
    <circle cx="95" cy="250" r="8" fill="#2b6cb0"/><circle cx="151" cy="250" r="8" fill="#2b6cb0"/><circle cx="168" cy="250" r="8" fill="#2b6cb0"/>
    <circle cx="374" cy="250" r="8" fill="#4a5568"/><circle cx="506" cy="250" r="8" fill="#4a5568"/><circle cx="613" cy="250" r="8" fill="#4a5568"/>
    <circle cx="634" cy="250" r="8" fill="#4a5568"/><circle cx="779" cy="250" r="8" fill="#c53030"/>
  </g>

  <!-- labels -->
  <g text-anchor="middle" font-weight="bold">
    <text x="95" y="196" fill="#2b6cb0">XPS</text><text x="95" y="214" fill="#2b6cb0" font-weight="normal">0.025</text>
    <text x="168" y="146" fill="#2b6cb0">EPS</text><text x="168" y="164" fill="#2b6cb0" font-weight="normal">0.04</text>
    <text x="151" y="316" fill="#2b6cb0">mineral wool</text><text x="151" y="334" fill="#2b6cb0" font-weight="normal">0.036</text>
    <text x="374" y="196" fill="#4a5568">AAC</text><text x="374" y="214" fill="#4a5568" font-weight="normal">0.15</text>
    <text x="506" y="196" fill="#4a5568">hollow brick</text><text x="506" y="214" fill="#4a5568" font-weight="normal">0.35</text>
    <text x="613" y="196" fill="#4a5568">solid brick</text><text x="613" y="214" fill="#4a5568" font-weight="normal">0.70</text>
    <text x="634" y="316" fill="#4a5568">cement plaster</text><text x="634" y="334" fill="#4a5568" font-weight="normal">0.80</text>
    <text x="779" y="196" fill="#c53030">reinforced concrete</text><text x="779" y="214" fill="#c53030" font-weight="normal">2.03</text>
  </g>

  <text x="450" y="385" text-anchor="middle" fill="#4a5568">thermal conductivity λ in W/mK: how much heat passes through 1 m of material for each kelvin of difference</text>
  <text x="60" y="430" fill="#2b6cb0" font-weight="bold">← less heat conducted</text>
  <text x="840" y="430" text-anchor="end" fill="#c53030" font-weight="bold">more heat conducted →</text>
  <text x="450" y="462" text-anchor="middle" fill="#4a5568">AAC is a masonry block that insulates a little; EPS, XPS and mineral wool are about 4 to 6 times better still</text>
</svg>
