<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" font-family="Segoe UI, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#c53030"/></marker>
  </defs>
  <rect width="900" height="500" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#4a5568">The wall as a series of thermal resistances (like an electrical circuit)</text>

  <!-- heat flow arrow -->
  <line x1="820" y1="95" x2="80" y2="95" stroke="#c53030" stroke-width="4" marker-end="url(#ar)"/>
  <text x="450" y="82" text-anchor="middle" fill="#c53030">heat flow q, from the warm inside to the cold outside</text>

  <!-- wire and potentials -->
  <line x1="40" y1="220" x2="860" y2="220" stroke="#4a5568" stroke-width="3"/>
  <circle cx="40" cy="220" r="12" fill="#2b6cb0"/>
  <circle cx="860" cy="220" r="12" fill="#c53030"/>
  <text x="52" y="170" text-anchor="middle" fill="#2b6cb0" font-weight="bold">t_E = 5 °C</text>
  <text x="52" y="188" text-anchor="middle" fill="#2b6cb0">outside</text>
  <text x="848" y="170" text-anchor="middle" fill="#c53030" font-weight="bold">t_I = 24 °C</text>
  <text x="848" y="188" text-anchor="middle" fill="#c53030">inside</text>

  <!-- resistors, left = outside -->
  <g stroke="#4a5568" stroke-width="2">
    <rect x="72"  y="190" width="96" height="60" rx="6" fill="#bee3f8"/>
    <rect x="182" y="190" width="96" height="60" rx="6" fill="#fefcbf"/>
    <rect x="292" y="190" width="96" height="60" rx="6" fill="#c6f6d5"/>
    <rect x="402" y="190" width="96" height="60" rx="6" fill="#e2e8f0"/>
    <rect x="512" y="190" width="96" height="60" rx="6" fill="#e2e8f0"/>
    <rect x="622" y="190" width="96" height="60" rx="6" fill="#e2e8f0"/>
    <rect x="732" y="190" width="96" height="60" rx="6" fill="#fed7d7"/>
  </g>
  <g text-anchor="middle" fill="#2d3748" font-weight="bold">
    <text x="120" y="226">1/α_E</text>
    <text x="230" y="226">plaster</text>
    <text x="340" y="226">EPS</text>
    <text x="450" y="226">mortar</text>
    <text x="560" y="226">AAC</text>
    <text x="670" y="226">mortar</text>
    <text x="780" y="226">1/α_I</text>
  </g>
  <!-- value rows -->
  <g text-anchor="middle" fill="#4a5568">
    <text x="120" y="274">1/24</text><text x="230" y="274">0.005/0.024</text><text x="340" y="274">0.10/0.04</text>
    <text x="450" y="274">0.003/0.87</text><text x="560" y="274">0.25/0.15</text><text x="670" y="274">0.002/0.87</text><text x="780" y="274">1/8</text>
  </g>
  <g text-anchor="middle" fill="#2d3748" font-weight="bold">
    <text x="120" y="294">0.042</text><text x="230" y="294">0.208</text><text x="340" y="294">2.500</text>
    <text x="450" y="294">0.003</text><text x="560" y="294">1.667</text><text x="670" y="294">0.002</text><text x="780" y="294">0.125</text>
  </g>
  <text x="30" y="312" fill="#4a5568">R in m²K/W</text>

  <!-- share bar -->
  <rect x="72"    y="326" width="6.9"   height="18" fill="#2b6cb0"/>
  <rect x="78.9"  y="326" width="34.7"  height="18" fill="#d69e2e"/>
  <rect x="113.6" y="326" width="415.6" height="18" fill="#2f855a"/>
  <rect x="529.2" y="326" width="0.6"   height="18" fill="#718096"/>
  <rect x="529.8" y="326" width="277.1" height="18" fill="#718096"/>
  <rect x="806.9" y="326" width="0.4"   height="18" fill="#a0aec0"/>
  <rect x="807.3" y="326" width="20.7"  height="18" fill="#c53030"/>
  <text x="450" y="364" text-anchor="middle" fill="#4a5568">share of the total resistance: EPS 55 %, AAC 37 %, everything else 8 %</text>

  <!-- formulas -->
  <rect x="100" y="385" width="700" height="95" rx="8" fill="#f7fafc" stroke="#a0aec0"/>
  <text x="450" y="412" text-anchor="middle" font-weight="bold" font-size="16" fill="#2d3748">k = 1 / ( 1/α_i + Σ δ/λ + 1/α_e )</text>
  <text x="450" y="437" text-anchor="middle" fill="#4a5568">R_total = 0.125 + 4.381 + 0.042 = 4.548 m²K/W, so k = 0.220 W/m²K</text>
  <text x="450" y="462" text-anchor="middle" font-weight="bold" fill="#c53030">q = k (t_I − t_E) = 0.220 × (24 − 5) = 4.18 W/m²</text>
</svg>
