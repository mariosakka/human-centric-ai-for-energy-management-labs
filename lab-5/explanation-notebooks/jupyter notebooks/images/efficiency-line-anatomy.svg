<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" font-family="Segoe UI, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#4a5568"/></marker>
  </defs>
  <rect width="900" height="480" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#4a5568">Reading a characteristic curve: intercept, slope, crossing</text>

  <line x1="110" y1="400" x2="110" y2="60" stroke="#4a5568" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="110" y1="400" x2="790" y2="400" stroke="#4a5568" stroke-width="2" marker-end="url(#ar)"/>
  <text x="450" y="450" text-anchor="middle" fill="#4a5568" font-weight="bold">x = (T_i − T_a) / G_T   (to the right: colder, dimmer or a hotter fluid)</text>
  <text x="45" y="230" fill="#4a5568" font-weight="bold" transform="rotate(-90 45 230)" text-anchor="middle">efficiency η</text>

  <line x1="110" y1="100" x2="560" y2="400" stroke="#dd6b20" stroke-width="4"/>
  <line x1="110" y1="135" x2="720" y2="400" stroke="#2b6cb0" stroke-width="4"/>

  <line x1="261" y1="200" x2="261" y2="400" stroke="#a0aec0" stroke-dasharray="5 4"/>
  <circle cx="261" cy="200" r="7" fill="#ffffff" stroke="#2d3748" stroke-width="3"/>
  <text x="261" y="420" text-anchor="middle" fill="#2d3748" font-weight="bold" font-size="13">crossing</text>

  <circle cx="110" cy="100" r="5" fill="#dd6b20"/><circle cx="110" cy="135" r="5" fill="#2b6cb0"/>
  <text x="122" y="92" fill="#dd6b20" font-weight="bold">intercept of A (higher)</text>
  <text x="115" y="252" fill="#2b6cb0" font-weight="bold">intercept of B (lower, blue dot)</text>

  <circle cx="560" cy="400" r="5" fill="#dd6b20"/><circle cx="720" cy="400" r="5" fill="#2b6cb0"/>
  <text x="560" y="422" text-anchor="middle" fill="#dd6b20" font-size="12">η = 0 for A</text>
  <text x="720" y="422" text-anchor="middle" fill="#2b6cb0" font-size="12">η = 0 for B</text>

  <text x="275" y="372" fill="#dd6b20" font-weight="bold">A: steep line (large slope)</text>
  <text x="520" y="228" fill="#2b6cb0" font-weight="bold">B: gentle line (small slope)</text>
  <text x="135" y="290" fill="#2d3748" font-size="13">left of the crossing,</text>
  <text x="135" y="308" fill="#2d3748" font-size="13">A is better (intercept wins)</text>
  <text x="600" y="285" fill="#2d3748" font-size="13">right of the crossing,</text>
  <text x="600" y="303" fill="#2d3748" font-size="13">B is better (slope wins)</text>
</svg>
