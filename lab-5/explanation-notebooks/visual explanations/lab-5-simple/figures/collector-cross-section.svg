<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" font-family="Segoe UI, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="ry" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#d69e2e"/></marker>
    <marker id="rr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#c53030"/></marker>
    <marker id="rb" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#2b6cb0"/></marker>
  </defs>
  <rect width="900" height="480" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#4a5568">Flat-plate collector, seen from the side</text>

  <g stroke="#d69e2e" stroke-width="3" marker-end="url(#ry)">
    <line x1="190" y1="80" x2="250" y2="170"/><line x1="290" y1="80" x2="350" y2="170"/><line x1="390" y1="80" x2="450" y2="170"/>
  </g>
  <text x="20" y="72" fill="#b7791f" font-weight="bold">sun, G_T</text>
  <text x="20" y="90" fill="#b7791f" font-size="12">(W per m² of glass)</text>

  <rect x="150" y="150" width="480" height="230" fill="#edf2f7" stroke="#4a5568" stroke-width="2"/>
  <rect x="150" y="150" width="480" height="8" fill="#bee3f8" stroke="#2b6cb0"/>
  <rect x="150" y="176" width="480" height="8" fill="#bee3f8" stroke="#2b6cb0"/>
  <rect x="165" y="236" width="450" height="10" fill="#2d3748"/>
  <g fill="#bee3f8" stroke="#2b6cb0" stroke-width="2">
    <circle cx="225" cy="262" r="14"/><circle cx="315" cy="262" r="14"/><circle cx="405" cy="262" r="14"/><circle cx="495" cy="262" r="14"/><circle cx="585" cy="262" r="14"/>
  </g>
  <rect x="152" y="300" width="476" height="78" fill="#fefcbf" stroke="#d69e2e"/>
  <text x="390" y="345" text-anchor="middle" fill="#744210" font-weight="bold">insulation</text>

  <g stroke="#c53030" stroke-width="3" marker-end="url(#rr)">
    <line x1="470" y1="225" x2="470" y2="115"/><line x1="560" y1="225" x2="560" y2="115"/>
  </g>
  <text x="515" y="98" text-anchor="middle" fill="#c53030" font-weight="bold">heat lost through the glass</text>

  <line x1="60" y1="262" x2="140" y2="262" stroke="#2b6cb0" stroke-width="5" marker-end="url(#rb)"/>
  <text x="20" y="245" fill="#2b6cb0" font-weight="bold">fluid in, T_i</text>
  <line x1="640" y1="262" x2="720" y2="262" stroke="#c53030" stroke-width="5" marker-end="url(#rr)"/>
  <text x="650" y="245" fill="#c53030" font-weight="bold">warmer fluid out</text>
  <text x="650" y="295" fill="#c53030" font-size="13">carries the useful heat q_u</text>

  <g fill="#2d3748" font-size="13">
    <line x1="630" y1="154" x2="700" y2="154" stroke="#a0aec0"/><text x="705" y="159">glazing: two panes</text>
    <line x1="615" y1="241" x2="700" y2="205" stroke="#a0aec0"/><text x="705" y="203">absorber plate (dark)</text>
    <line x1="595" y1="276" x2="700" y2="330" stroke="#a0aec0"/><text x="705" y="335">tubes carrying the fluid</text>
  </g>
  <text x="390" y="425" text-anchor="middle" fill="#4a5568">Useful heat = sunlight absorbed by the plate − heat that escapes to the outside air T_a</text>
</svg>
