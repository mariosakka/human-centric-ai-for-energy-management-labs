<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" font-family="Segoe UI, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="ag" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#4a5568"/></marker>
  </defs>
  <rect width="900" height="500" fill="#ffffff"/>
  <text x="450" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#4a5568">Current-voltage curve of a module (schematic, not to scale)</text>

  <!-- legend -->
  <line x1="560" y1="50" x2="600" y2="50" stroke="#2b6cb0" stroke-width="4"/>
  <text x="608" y="55" fill="#2b6cb0">STC: 1000 W/m², 25 °C</text>
  <line x1="560" y1="74" x2="600" y2="74" stroke="#dd6b20" stroke-width="4"/>
  <text x="608" y="79" fill="#c05621">500 W/m², cell at 27.6 °C</text>

  <!-- FF rectangles -->
  <rect x="110" y="136" width="590" height="284" fill="none" stroke="#4a5568" stroke-width="1.5" stroke-dasharray="7 5"/>
  <rect x="110" y="167" width="496" height="253" fill="#bee3f8" fill-opacity="0.55" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="358" y="372" text-anchor="middle" fill="#2c5282" font-weight="bold">blue area = U · I at the best point = P_M</text>
  <text x="358" y="396" text-anchor="middle" fill="#2c5282">FF = blue area / dashed area</text>
  <text x="400" y="128" text-anchor="middle" fill="#4a5568">dashed area = U0 · Isc</text>

  <!-- axes -->
  <line x1="110" y1="420" x2="770" y2="420" stroke="#4a5568" stroke-width="2.5" marker-end="url(#ag)"/>
  <line x1="110" y1="420" x2="110" y2="90" stroke="#4a5568" stroke-width="2.5" marker-end="url(#ag)"/>
  <text x="770" y="470" text-anchor="end" fill="#4a5568">Voltage U [V]</text>
  <text x="104" y="84" text-anchor="end" fill="#4a5568">Current I [A]</text>
  <text x="100" y="141" text-anchor="end" fill="#2b6cb0">Isc,st = 8.36 A</text>
  <text x="100" y="283" text-anchor="end" fill="#c05621">4.19 A</text>
  <text x="700" y="440" text-anchor="middle" fill="#2b6cb0">U0,st = 36.9 V</text>

  <!-- curves -->
  <path d="M110,136 C400,134 560,138 606,167 S690,300 700,420" fill="none" stroke="#2b6cb0" stroke-width="4"/>
  <path d="M110,277.7 C397.3,276.7 555.8,278.8 601.3,293.3 S684.6,359.9 694.5,420" fill="none" stroke="#dd6b20" stroke-width="4"/>
  <circle cx="606" cy="167" r="6" fill="#2b6cb0"/>
  <text x="560" y="104" text-anchor="middle" fill="#2c5282" font-size="13">maximum power point (MPP)</text>
  <line x1="580" y1="108" x2="602" y2="160" stroke="#2c5282" stroke-width="1.5"/>

  <!-- effects -->
  <line x1="150" y1="142" x2="150" y2="272" stroke="#4a5568" stroke-width="2" marker-end="url(#ag)"/>
  <text x="162" y="204" fill="#4a5568">half the sun,</text>
  <text x="162" y="222" fill="#4a5568">half the current</text>
  <text x="730" y="352" fill="#4a5568" font-size="13">the voltage</text>
  <text x="730" y="370" fill="#4a5568" font-size="13">barely moves</text>
  <text x="730" y="388" fill="#4a5568" font-size="13">(36.9 → 36.6 V)</text>
</svg>
