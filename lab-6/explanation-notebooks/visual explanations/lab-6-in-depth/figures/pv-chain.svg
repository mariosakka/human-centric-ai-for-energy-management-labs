<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" font-family="Segoe UI, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="ag" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#4a5568"/></marker>
  </defs>
  <rect width="900" height="440" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#4a5568">From sunlight to electricity: cell, module, output</text>

  <!-- sun -->
  <g stroke="#d69e2e" stroke-width="3">
    <line x1="80" y1="140" x2="80" y2="122"/><line x1="80" y1="240" x2="80" y2="258"/>
    <line x1="30" y1="190" x2="12" y2="190"/><line x1="130" y1="190" x2="148" y2="190"/>
    <line x1="45" y1="155" x2="32" y2="142"/><line x1="115" y1="225" x2="128" y2="238"/>
    <line x1="45" y1="225" x2="32" y2="238"/><line x1="115" y1="155" x2="128" y2="142"/>
  </g>
  <circle cx="80" cy="190" r="34" fill="#f6e05e" stroke="#d69e2e" stroke-width="2"/>
  <text x="80" y="290" text-anchor="middle" fill="#4a5568">the sun</text>

  <line x1="155" y1="195" x2="262" y2="195" stroke="#4a5568" stroke-width="2.5" marker-end="url(#ag)"/>
  <text x="208" y="178" text-anchor="middle" fill="#975a16" font-weight="bold">G</text>
  <text x="208" y="218" text-anchor="middle" fill="#4a5568" font-size="12">W/m²</text>

  <!-- one cell -->
  <text x="330" y="118" text-anchor="middle" fill="#4a5568" font-weight="bold">one cell</text>
  <rect x="270" y="135" width="120" height="120" rx="4" fill="#2c5282" stroke="#1a365d" stroke-width="2"/>
  <g stroke="#bee3f8" stroke-width="2">
    <line x1="300" y1="135" x2="300" y2="255"/><line x1="330" y1="135" x2="330" y2="255"/><line x1="360" y1="135" x2="360" y2="255"/>
  </g>
  <line x1="270" y1="195" x2="390" y2="195" stroke="#e2e8f0" stroke-width="5"/>

  <line x1="398" y1="195" x2="472" y2="195" stroke="#4a5568" stroke-width="2.5" marker-end="url(#ag)"/>

  <!-- module -->
  <text x="590" y="118" text-anchor="middle" fill="#4a5568" font-weight="bold">module: dozens of cells in series</text>
  <rect x="480" y="125" width="220" height="140" rx="4" fill="#cbd5e0" stroke="#4a5568" stroke-width="2.5"/>
  <g fill="#2c5282" stroke="#1a365d">
    <rect x="490" y="135" width="30" height="28"/><rect x="525" y="135" width="30" height="28"/><rect x="560" y="135" width="30" height="28"/><rect x="595" y="135" width="30" height="28"/><rect x="630" y="135" width="30" height="28"/><rect x="665" y="135" width="25" height="28"/>
    <rect x="490" y="168" width="30" height="28"/><rect x="525" y="168" width="30" height="28"/><rect x="560" y="168" width="30" height="28"/><rect x="595" y="168" width="30" height="28"/><rect x="630" y="168" width="30" height="28"/><rect x="665" y="168" width="25" height="28"/>
    <rect x="490" y="201" width="30" height="28"/><rect x="525" y="201" width="30" height="28"/><rect x="560" y="201" width="30" height="28"/><rect x="595" y="201" width="30" height="28"/><rect x="630" y="201" width="30" height="28"/><rect x="665" y="201" width="25" height="28"/>
  </g>
  <text x="590" y="252" text-anchor="middle" fill="#4a5568" font-size="12">Kyocera KD230GX-LPB</text>

  <line x1="708" y1="195" x2="772" y2="195" stroke="#4a5568" stroke-width="2.5" marker-end="url(#ag)"/>

  <!-- output -->
  <rect x="780" y="140" width="110" height="110" rx="8" fill="#c6f6d5" stroke="#2f855a" stroke-width="2"/>
  <text x="835" y="168" text-anchor="middle" fill="#276749" font-weight="bold">DC output</text>
  <text x="835" y="192" text-anchor="middle" fill="#276749">voltage U</text>
  <text x="835" y="212" text-anchor="middle" fill="#276749">current I</text>
  <text x="835" y="236" text-anchor="middle" fill="#276749" font-weight="bold">P = U · I</text>

  <!-- heat -->
  <line x1="330" y1="262" x2="330" y2="332" stroke="#c05621" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ag)"/>
  <line x1="590" y1="272" x2="590" y2="332" stroke="#c05621" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ag)"/>
  <rect x="200" y="340" width="540" height="64" rx="8" fill="#feebc8" stroke="#c05621" stroke-width="2"/>
  <text x="470" y="365" text-anchor="middle" fill="#7b341e" font-weight="bold">Not all the sunlight becomes electricity: the rest heats the cells</text>
  <text x="470" y="388" text-anchor="middle" fill="#7b341e">the cells get hotter than the surrounding air</text>
</svg>
