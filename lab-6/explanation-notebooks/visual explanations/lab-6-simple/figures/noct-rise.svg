<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" font-family="Segoe UI, Arial, sans-serif" font-size="14">
  <rect width="900" height="440" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#4a5568">Cell temperature = air temperature + heating by the sun</text>

  <rect x="150" y="48" width="18" height="14" fill="#90cdf4"/><text x="174" y="60" fill="#4a5568">air temperature t_a</text>
  <rect x="380" y="48" width="18" height="14" fill="#f6ad55"/><text x="404" y="60" fill="#4a5568">heating by the sunlight: (NOCT − 20) / 800 · G</text>

  <!-- morning: scale 150 + 9.143 px per degC -->
  <text x="20" y="140" fill="#4a5568" font-weight="bold">Spring morning</text>
  <text x="20" y="160" fill="#4a5568" font-size="13">G = 500 W/m²</text>
  <rect x="150" y="120" width="110" height="50" fill="#90cdf4" stroke="#4a5568"/>
  <rect x="260" y="120" width="143" height="50" fill="#f6ad55" stroke="#4a5568"/>
  <text x="205" y="150" text-anchor="middle" fill="#2a4365" font-weight="bold">12 °C</text>
  <text x="331" y="150" text-anchor="middle" fill="#7b341e" font-weight="bold">+15.6</text>
  <text x="413" y="150" fill="#4a5568" font-weight="bold">cell 27.6 °C</text>

  <!-- noon -->
  <text x="20" y="240" fill="#4a5568" font-weight="bold">Hot noon</text>
  <text x="20" y="260" fill="#4a5568" font-size="13">G = 900 W/m²</text>
  <rect x="150" y="220" width="274" height="50" fill="#90cdf4" stroke="#4a5568"/>
  <rect x="424" y="220" width="257" height="50" fill="#f6ad55" stroke="#4a5568"/>
  <text x="287" y="250" text-anchor="middle" fill="#2a4365" font-weight="bold">30 °C</text>
  <text x="552" y="250" text-anchor="middle" fill="#7b341e" font-weight="bold">+28.1</text>
  <text x="691" y="250" fill="#4a5568" font-weight="bold">cell 58.1 °C</text>

  <!-- reference line at 25 degC -->
  <line x1="378.6" y1="100" x2="378.6" y2="300" stroke="#c53030" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="378.6" y="94" text-anchor="middle" fill="#c53030" font-size="13">25 °C: cell temperature of the STC test</text>

  <!-- axis -->
  <line x1="150" y1="300" x2="790" y2="300" stroke="#4a5568" stroke-width="2"/>
  <g stroke="#4a5568" stroke-width="1.5">
    <line x1="150" y1="300" x2="150" y2="308"/><line x1="241.4" y1="300" x2="241.4" y2="308"/><line x1="332.9" y1="300" x2="332.9" y2="308"/><line x1="424.3" y1="300" x2="424.3" y2="308"/><line x1="515.7" y1="300" x2="515.7" y2="308"/><line x1="607.1" y1="300" x2="607.1" y2="308"/><line x1="698.6" y1="300" x2="698.6" y2="308"/><line x1="790" y1="300" x2="790" y2="308"/>
  </g>
  <g fill="#4a5568" text-anchor="middle" font-size="13">
    <text x="150" y="326">0</text><text x="241.4" y="326">10</text><text x="332.9" y="326">20</text><text x="424.3" y="326">30</text><text x="515.7" y="326">40</text><text x="607.1" y="326">50</text><text x="698.6" y="326">60</text><text x="790" y="326">70 °C</text>
  </g>

  <rect x="150" y="350" width="640" height="62" rx="8" fill="#edf2f7" stroke="#a0aec0"/>
  <text x="470" y="374" text-anchor="middle" fill="#4a5568">NOCT = 45 °C is the cell temperature measured at 800 W/m² with 20 °C air.</text>
  <text x="470" y="397" text-anchor="middle" fill="#4a5568">So each 1 W/m² of sunlight warms the cell by 25/800 = 0.03125 °C above the air.</text>
</svg>
