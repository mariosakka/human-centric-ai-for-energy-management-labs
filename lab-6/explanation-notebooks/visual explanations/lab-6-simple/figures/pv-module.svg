  <text x="400" y="100" fill="#4a5568" font-weight="bold">about 60 cells (6 × 10) wired one after the other</text>
  <text x="400" y="122" fill="#4a5568">the yellow line is the wire that links each cell to the next: in series</text>
  <text x="400" y="156" fill="#4a5568" font-weight="bold">the same current flows through every cell</text>
  <text x="400" y="178" fill="#4a5568">like water through pipes joined end to end</text>
  <text x="400" y="212" fill="#4a5568" font-weight="bold">the voltages add up: 60 cells × about 0.6 V ≈ 36 V</text>
  <text x="400" y="234" fill="#4a5568">one cell alone gives too little voltage to be useful</text>
  <text x="400" y="278" fill="#4a5568" font-weight="bold">side view of the module, layer by layer</text>
