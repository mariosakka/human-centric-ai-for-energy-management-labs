<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 305" width="800" height="305" font-family="sans-serif" font-size="14">
  <defs><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c53030"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2b6cb0"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f855a"/></marker><marker id="ay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b7791f"/></marker></defs>
  <rect width="800" height="305" fill="#ffffff"/>
  <rect x="190" y="50" width="420" height="200" rx="12" fill="#edf2f7" stroke="#4a5568" stroke-width="2.5"/>
  <text x="400" y="280" text-anchor="middle" fill="#4a5568" font-weight="bold">Dehumidifier</text>
  <rect x="270" y="80" width="130" height="100" rx="10" fill="#bee3f8" stroke="#2b6cb0" stroke-width="2"/>
  <text x="335" y="125" text-anchor="middle" fill="#2b6cb0">cold</text>
  <text x="335" y="144" text-anchor="middle" fill="#2b6cb0">surface</text>
  <line x1="10" y1="130" x2="268" y2="130" stroke="#4a5568" stroke-width="3" marker-end="url(#ag)"/>
  <text x="100" y="85" text-anchor="middle" fill="#4a5568" font-size="13">warm, humid air in</text>
  <text x="100" y="104" text-anchor="middle" fill="#4a5568" font-size="13">(lots of vapour)</text>
  <line x1="402" y1="130" x2="790" y2="130" stroke="#4a5568" stroke-width="3" marker-end="url(#ag)"/>
  <text x="700" y="85" text-anchor="middle" fill="#4a5568" font-size="13">drier air out</text>
  <text x="700" y="104" text-anchor="middle" fill="#4a5568" font-size="13">(less vapour)</text>
  <path d="M290,192 q-6,10 0,16 q6,-6 0,-16 z" fill="#2b6cb0"/>
  <path d="M320,198 q-6,10 0,16 q6,-6 0,-16 z" fill="#2b6cb0"/>
  <path d="M350,192 q-6,10 0,16 q6,-6 0,-16 z" fill="#2b6cb0"/>
  <path d="M378,198 q-6,10 0,16 q6,-6 0,-16 z" fill="#2b6cb0"/>
  <rect x="262" y="218" width="146" height="12" rx="3" fill="#a0aec0" stroke="#4a5568" stroke-width="2"/>
  <text x="425" y="204" text-anchor="start" fill="#2b6cb0" font-size="13">vapour condenses into droplets</text>
  <text x="425" y="224" text-anchor="start" fill="#2b6cb0" font-size="13">that fall into a drain tray</text>
</svg>
