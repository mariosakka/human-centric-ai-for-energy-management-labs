<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" font-family="sans-serif" font-size="14">
  <defs><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c53030"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2b6cb0"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f855a"/></marker><marker id="ay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b7791f"/></marker></defs>
  <rect width="800" height="340" fill="#ffffff"/>
  <rect x="30" y="40" width="340" height="250" rx="6" fill="#f7fafc" stroke="#4a5568" stroke-width="2"/>
  <text x="200" y="62" text-anchor="middle" fill="#4a5568" font-size="13">wall of the room</text>
  <rect x="90" y="78" width="220" height="190" rx="14" fill="#edf2f7" stroke="#4a5568" stroke-width="3"/>
  <text x="200" y="100" text-anchor="middle" fill="#4a5568" font-weight="bold">thermostat</text>
  <rect x="110" y="112" width="180" height="40" rx="4" fill="#ffffff" stroke="#4a5568" stroke-width="2"/>
  <text x="200" y="139" text-anchor="middle" fill="#4a5568" font-size="15">now 19.5 °C</text>
  <circle cx="160" cy="205" r="32" fill="#ffffff" stroke="#4a5568" stroke-width="3"/>
  <line x1="160" y1="205" x2="180" y2="187" stroke="#c53030" stroke-width="4"/>
  <text x="160" y="256" text-anchor="middle" fill="#4a5568" font-size="12">setpoint dial</text>
  <rect x="215" y="178" width="80" height="60" rx="6" fill="#fefcbf" stroke="#b7791f" stroke-width="2"/>
  <text x="255" y="202" text-anchor="middle" fill="#4a5568" font-size="12">thermometer</text>
  <text x="255" y="220" text-anchor="middle" fill="#4a5568" font-size="12">inside</text>
  <line x1="372" y1="175" x2="470" y2="175" stroke="#4a5568" stroke-width="3" marker-end="url(#ag)"/>
  <text x="420" y="160" text-anchor="middle" fill="#4a5568" font-weight="bold" font-size="13">ON / OFF</text>
  <rect x="472" y="130" width="130" height="90" rx="10" fill="#fed7d7" stroke="#c53030" stroke-width="2"/>
  <text x="537" y="168" text-anchor="middle" fill="#c53030" font-weight="bold">heater</text>
  <text x="537" y="190" text-anchor="middle" fill="#c53030" font-size="12">switched on / off</text>
  <text x="700" y="140" text-anchor="middle" fill="#4a5568" font-size="13">colder than the</text>
  <text x="700" y="159" text-anchor="middle" fill="#4a5568" font-size="13">setpoint → ON</text>
  <text x="700" y="178" text-anchor="middle" fill="#4a5568" font-size="13">warm enough → OFF</text>
  <text x="400" y="320" text-anchor="middle" fill="#4a5568" font-size="13">it keeps comparing the thermometer reading with the setpoint</text>
