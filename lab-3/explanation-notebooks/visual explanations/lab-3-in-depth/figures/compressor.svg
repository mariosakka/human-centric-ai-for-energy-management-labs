<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 345" width="800" height="345" font-family="sans-serif" font-size="14">
  <defs><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c53030"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2b6cb0"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f855a"/></marker><marker id="ay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b7791f"/></marker></defs>
  <rect width="800" height="345" fill="#ffffff"/>
  <rect x="70" y="40" width="230" height="80" rx="10" fill="#bee3f8" stroke="#2b6cb0" stroke-width="2"/>
  <text x="185" y="72" text-anchor="middle" fill="#2b6cb0" font-weight="bold">evaporator</text>
  <text x="185" y="94" text-anchor="middle" fill="#4a5568" font-size="13">takes heat from the room</text>
  <rect x="500" y="40" width="230" height="80" rx="10" fill="#c6f6d5" stroke="#2f855a" stroke-width="2"/>
  <text x="615" y="72" text-anchor="middle" fill="#2f855a" font-weight="bold">compressor</text>
  <text x="615" y="94" text-anchor="middle" fill="#4a5568" font-size="13">the pump: squeezes the gas</text>
  <rect x="500" y="220" width="230" height="80" rx="10" fill="#fed7d7" stroke="#c53030" stroke-width="2"/>
  <text x="615" y="252" text-anchor="middle" fill="#c53030" font-weight="bold">condenser</text>
  <text x="615" y="274" text-anchor="middle" fill="#4a5568" font-size="13">gives heat to the outside</text>
  <rect x="70" y="220" width="230" height="80" rx="10" fill="#edf2f7" stroke="#4a5568" stroke-width="2"/>
  <text x="185" y="252" text-anchor="middle" fill="#4a5568" font-weight="bold">expansion valve</text>
  <text x="185" y="274" text-anchor="middle" fill="#4a5568" font-size="13">lets the pressure drop</text>
  <line x1="302" y1="80" x2="498" y2="80" stroke="#4a5568" stroke-width="3" marker-end="url(#ag)"/>
  <text x="400" y="68" text-anchor="middle" fill="#4a5568" font-size="13">gas</text>
  <line x1="615" y1="122" x2="615" y2="218" stroke="#c53030" stroke-width="3" marker-end="url(#ar)"/>
  <text x="660" y="175" text-anchor="start" fill="#c53030" font-size="13">hot gas</text>
  <line x1="498" y1="260" x2="302" y2="260" stroke="#2b6cb0" stroke-width="3" marker-end="url(#ab)"/>
  <text x="400" y="248" text-anchor="middle" fill="#2b6cb0" font-size="13">liquid</text>
  <line x1="185" y1="218" x2="185" y2="122" stroke="#2b6cb0" stroke-width="3" marker-end="url(#ab)"/>
  <text x="140" y="175" text-anchor="end" fill="#2b6cb0" font-size="13">cold</text>
  <text x="400" y="175" text-anchor="middle" fill="#4a5568" font-size="13">the same fluid goes round and round</text>
  <text x="400" y="195" text-anchor="middle" fill="#4a5568" font-size="13">(electricity runs the compressor)</text>
  <text x="400" y="330" text-anchor="middle" fill="#4a5568" font-weight="bold">Compressor in an air-conditioning cycle</text>
</svg>
