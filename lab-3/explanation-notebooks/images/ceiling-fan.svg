<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2b6cb0"/></marker>
    <g id="person" fill="none" stroke="#4a5568" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="415,200 415,288 535,288" stroke="#a0aec0" stroke-width="4"/>
      <line x1="420" y1="288" x2="420" y2="360" stroke="#a0aec0" stroke-width="4"/>
      <line x1="530" y1="288" x2="530" y2="360" stroke="#a0aec0" stroke-width="4"/>
      <circle cx="440" cy="150" r="26" fill="#ffffff"/>
      <line x1="440" y1="176" x2="440" y2="280"/>
      <polyline points="440,280 520,280 520,350"/>
      <polyline points="440,200 485,240 510,250"/>
    </g>
  </defs>
  <rect width="900" height="500" fill="#ffffff"/>

  <!-- LEFT panel: still air -->
  <text x="230" y="36" font-size="18" font-weight="bold" fill="#c53030" text-anchor="middle">Still air, 25 C: warm</text>
  <rect x="20" y="52" width="420" height="348" fill="#fffaf0" stroke="#a0aec0" stroke-width="2"/>
  <line x1="230" y1="52" x2="230" y2="84" stroke="#4a5568" stroke-width="5"/>
  <rect x="140" y="84" width="180" height="10" rx="5" fill="#a0aec0" stroke="#4a5568" stroke-width="2"/>
  <text x="230" y="118" font-size="14" fill="#4a5568" text-anchor="middle">ceiling fan off</text>
  <rect x="438" y="0" width="0" height="0" fill="none"/>
  <rect x="213" y="214" width="30" height="100" rx="14" fill="#fed7d7"/>
  <use href="#person" transform="translate(-245,40)"/>
  <g stroke="#c53030" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M130 200 q8 -12 0 -24 q-8 -12 0 -24"/>
    <path d="M270 200 q8 -12 0 -24 q-8 -12 0 -24"/>
  </g>
  <line x1="20" y1="400" x2="440" y2="400" stroke="#4a5568" stroke-width="3"/>
  <rect x="60" y="414" width="340" height="38" rx="8" fill="#fff5f5" stroke="#c53030" stroke-width="2"/>
  <text x="230" y="438" font-size="15" fill="#4a5568" text-anchor="middle">t_a = 25 C, v = 0.1 m/s, PMV = 0.28</text>

  <!-- RIGHT panel: fan on -->
  <text x="670" y="36" font-size="18" font-weight="bold" fill="#2f855a" text-anchor="middle">Fan 0.8 m/s: same comfort at about 27 C</text>
  <rect x="460" y="52" width="420" height="348" fill="#fffaf0" stroke="#a0aec0" stroke-width="2"/>
  <line x1="670" y1="52" x2="670" y2="84" stroke="#4a5568" stroke-width="5"/>
  <rect x="580" y="84" width="180" height="10" rx="5" fill="#a0aec0" stroke="#4a5568" stroke-width="2"/>
  <path d="M566 78 q-10 10 0 20 M774 78 q10 10 0 20" stroke="#2b6cb0" stroke-width="3" fill="none" stroke-linecap="round"/>
  <text x="670" y="118" font-size="14" fill="#4a5568" text-anchor="middle">ceiling fan on</text>
  <rect x="653" y="214" width="30" height="100" rx="14" fill="#c6f6d5"/>
  <use href="#person" transform="translate(195,40)"/>
  <g stroke="#2b6cb0" stroke-width="3.5" fill="none" stroke-linecap="round">
    <path d="M592 130 C 575 200, 575 280, 590 350" marker-end="url(#ah-blue)"/>
    <path d="M612 128 C 598 160, 596 200, 604 236" marker-end="url(#ah-blue)"/>
    <path d="M706 130 C 720 170, 724 215, 700 240" marker-end="url(#ah-blue)"/>
    <path d="M748 130 C 765 200, 765 280, 750 350" marker-end="url(#ah-blue)"/>
  </g>
  <line x1="460" y1="400" x2="880" y2="400" stroke="#4a5568" stroke-width="3"/>
  <rect x="500" y="414" width="340" height="38" rx="8" fill="#f0fff4" stroke="#2f855a" stroke-width="2"/>
  <text x="670" y="438" font-size="15" fill="#4a5568" text-anchor="middle">t_a = 27 C, v = 0.8 m/s, PMV = 0.28</text>

  <text x="450" y="484" font-size="15" font-weight="bold" fill="#4a5568" text-anchor="middle">Faster air removes more heat from the skin, so the room can be about 2 K warmer for the same comfort.</text>
</svg>
