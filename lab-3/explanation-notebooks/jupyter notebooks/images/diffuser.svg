<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330" font-family="sans-serif" font-size="14">
  <defs><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c53030"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2b6cb0"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f855a"/></marker><marker id="ay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b7791f"/></marker></defs>
  <rect width="800" height="330" fill="#ffffff"/>
  <rect x="20" y="70" width="760" height="22" rx="2" fill="#a0aec0" stroke="#4a5568" stroke-width="2"/>
  <text x="60" y="60" text-anchor="start" fill="#4a5568" font-size="13">ceiling</text>
  <rect x="260" y="12" width="280" height="48" rx="4" fill="#edf2f7" stroke="#4a5568" stroke-width="2"/>
  <text x="400" y="42" text-anchor="middle" fill="#4a5568" font-size="13">supply duct above the ceiling</text>
  <rect x="350" y="70" width="100" height="22" rx="2" fill="#edf2f7" stroke="#4a5568" stroke-width="3"/>
  <text x="400" y="112" text-anchor="middle" fill="#4a5568" font-weight="bold">diffuser</text>
  <text x="500" y="84" text-anchor="start" fill="#4a5568" font-size="12">(grille in the ceiling)</text>
  <line x1="400" y1="60" x2="400" y2="70" stroke="#2b6cb0" stroke-width="3" marker-end="url(#ab)"/>
  <path d="M370,95 C330,125 270,150 180,185" fill="none" stroke="#2b6cb0" stroke-width="3" marker-end="url(#ab)"/>
  <path d="M430,95 C470,125 530,150 620,185" fill="none" stroke="#2b6cb0" stroke-width="3" marker-end="url(#ab)"/>
  <path d="M400,125 V190" fill="none" stroke="#2b6cb0" stroke-width="3" marker-end="url(#ab)"/>
  <text x="170" y="215" text-anchor="middle" fill="#2b6cb0" font-size="13">air spreads along</text>
  <text x="170" y="234" text-anchor="middle" fill="#2b6cb0" font-size="13">the ceiling</text>
  <text x="630" y="215" text-anchor="middle" fill="#2b6cb0" font-size="13">and mixes with</text>
  <text x="630" y="234" text-anchor="middle" fill="#2b6cb0" font-size="13">the room air</text>
  <text x="400" y="215" text-anchor="middle" fill="#2b6cb0" font-size="13">it sinks slowly: no</text>
  <text x="400" y="234" text-anchor="middle" fill="#2b6cb0" font-size="13">cold draught on people</text>
  <rect x="60" y="280" width="680" height="12" rx="2" fill="#f7fafc" stroke="#a0aec0" stroke-width="2"/>
  <text x="400" y="312" text-anchor="middle" fill="#4a5568" font-size="13">floor of the room</text>
  <circle cx="280" cy="270" r="8" fill="#c6f6d5" stroke="#2f855a" stroke-width="2"/>
  <circle cx="520" cy="270" r="8" fill="#c6f6d5" stroke="#2f855a" stroke-width="2"/>
</svg>
