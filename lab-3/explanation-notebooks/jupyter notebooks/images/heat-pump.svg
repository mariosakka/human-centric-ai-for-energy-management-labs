<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 345" width="800" height="345" font-family="sans-serif" font-size="14">
  <defs><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c53030"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2b6cb0"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f855a"/></marker><marker id="ay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b7791f"/></marker></defs>
  <rect width="800" height="345" fill="#ffffff"/>
  <rect x="30" y="60" width="220" height="190" rx="12" fill="#c6f6d5" stroke="#2f855a" stroke-width="2"/>
  <text x="140" y="85" text-anchor="middle" fill="#2f855a" font-weight="bold">outdoor part</text>
  <text x="140" y="135" text-anchor="middle" fill="#2f855a">collects the heat</text>
  <text x="140" y="154" text-anchor="middle" fill="#2f855a">of the outside air,</text>
  <text x="140" y="173" text-anchor="middle" fill="#2f855a">even when it is cold</text>
  <rect x="290" y="60" width="220" height="190" rx="12" fill="#edf2f7" stroke="#4a5568" stroke-width="2"/>
  <text x="400" y="85" text-anchor="middle" fill="#4a5568" font-weight="bold">heat pump</text>
  <text x="400" y="135" text-anchor="middle" fill="#4a5568">refrigerant circuit:</text>
  <text x="400" y="154" text-anchor="middle" fill="#4a5568">carries the heat uphill,</text>
  <text x="400" y="173" text-anchor="middle" fill="#4a5568">uses a little electricity</text>
  <rect x="550" y="60" width="220" height="190" rx="12" fill="#bee3f8" stroke="#2b6cb0" stroke-width="2"/>
  <text x="660" y="85" text-anchor="middle" fill="#2b6cb0" font-weight="bold">building water loop</text>
  <text x="660" y="135" text-anchor="middle" fill="#2b6cb0">receives the heat and</text>
  <text x="660" y="154" text-anchor="middle" fill="#2b6cb0">sends warm water to</text>
  <text x="660" y="173" text-anchor="middle" fill="#2b6cb0">the building</text>
  <line x1="252" y1="165" x2="288" y2="165" stroke="#c53030" stroke-width="3" marker-end="url(#ar)"/>
  <line x1="512" y1="165" x2="548" y2="165" stroke="#c53030" stroke-width="3" marker-end="url(#ar)"/>
  <circle cx="140" cy="205" r="22" fill="#ffffff" stroke="#2f855a" stroke-width="2"/>
  <line x1="140" y1="205" x2="140" y2="187" stroke="#2f855a" stroke-width="3"/>
  <line x1="140" y1="205" x2="155.66" y2="214.0" stroke="#2f855a" stroke-width="3"/>
  <line x1="140" y1="205" x2="124.34" y2="214.0" stroke="#2f855a" stroke-width="3"/>
  <text x="140" y="241" text-anchor="middle" fill="#2f855a" font-size="12">fan</text>
  <text x="400" y="290" text-anchor="middle" fill="#c53030" font-size="13">heat flows from the cold outside to the warm building</text>
  <text x="400" y="325" text-anchor="middle" fill="#4a5568" font-weight="bold">Heat pump</text>
</svg>
