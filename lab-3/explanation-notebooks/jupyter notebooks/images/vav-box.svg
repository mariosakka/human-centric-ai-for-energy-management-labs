<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 345" width="800" height="345" font-family="sans-serif" font-size="14">
  <defs><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c53030"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2b6cb0"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f855a"/></marker><marker id="ay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b7791f"/></marker></defs>
  <rect width="800" height="345" fill="#ffffff"/>
  <rect x="150" y="120" width="380" height="110" rx="8" fill="#edf2f7" stroke="#4a5568" stroke-width="2.5"/>
  <text x="340" y="258" text-anchor="middle" fill="#4a5568" font-weight="bold">VAV box (Variable Air Volume)</text>
  <line x1="10" y1="175" x2="148" y2="175" stroke="#2b6cb0" stroke-width="4" marker-end="url(#ab)"/>
  <text x="80" y="118" text-anchor="middle" fill="#2b6cb0" font-size="13">air from</text>
  <text x="80" y="137" text-anchor="middle" fill="#2b6cb0" font-size="13">the AHU</text>
  <line x1="532" y1="175" x2="700" y2="175" stroke="#2b6cb0" stroke-width="4" marker-end="url(#ab)"/>
  <text x="650" y="118" text-anchor="middle" fill="#2b6cb0" font-size="13">less or more air</text>
  <text x="650" y="137" text-anchor="middle" fill="#2b6cb0" font-size="13">to the room</text>
  <line x1="235" y1="132" x2="262" y2="218" stroke="#4a5568" stroke-width="6" stroke-linecap="round"/>
  <circle cx="235" cy="132" r="6" fill="#4a5568" stroke="#4a5568" stroke-width="2"/>
  <text x="212" y="112" text-anchor="middle" fill="#4a5568" font-size="13">damper (flap)</text>
  <rect x="310" y="140" width="70" height="70" rx="6" fill="#fefcbf" stroke="#b7791f" stroke-width="2"/>
  <text x="345" y="170" text-anchor="middle" fill="#4a5568" font-size="12">airflow</text>
  <text x="345" y="186" text-anchor="middle" fill="#4a5568" font-size="12">sensor</text>
  <rect x="410" y="140" width="100" height="70" rx="6" fill="#fed7d7" stroke="#c53030" stroke-width="2"/>
  <text x="460" y="168" text-anchor="middle" fill="#4a5568" font-size="12">reheat coil</text>
  <text x="460" y="186" text-anchor="middle" fill="#4a5568" font-size="11">(optional)</text>
  <rect x="150" y="20" width="140" height="50" rx="8" fill="#c6f6d5" stroke="#2f855a" stroke-width="2"/>
  <text x="220" y="42" text-anchor="middle" fill="#2f855a" font-weight="bold">motor</text>
  <text x="220" y="60" text-anchor="middle" fill="#4a5568" font-size="12">turns the flap</text>
  <path d="M236,70 V126" fill="none" stroke="#4a5568" stroke-width="2" marker-end="url(#ag)"/>
  <rect x="432" y="275" width="230" height="55" rx="10" fill="#c6f6d5" stroke="#2f855a" stroke-width="2"/>
  <text x="547" y="298" text-anchor="middle" fill="#4a5568" font-size="12">room controller</text>
  <text x="547" y="316" text-anchor="middle" fill="#4a5568" font-size="12">asks for more or less air</text>
  <path d="M662,302 H765 V45 H292" fill="none" stroke="#4a5568" stroke-width="2" stroke-dasharray="8 5" marker-end="url(#ag)"/>
</svg>
