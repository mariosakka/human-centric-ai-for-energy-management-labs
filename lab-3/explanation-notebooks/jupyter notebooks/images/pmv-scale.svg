<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="scale" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#2b6cb0"/>
      <stop offset="0.5" stop-color="#c6f6d5"/>
      <stop offset="1" stop-color="#c53030"/>
    </linearGradient>
  </defs>
  <rect width="900" height="500" fill="#ffffff"/>

  <!-- gradient bar -->
  <rect x="60" y="190" width="780" height="50" rx="6" fill="url(#scale)" stroke="#4a5568" stroke-width="2"/>
  <rect x="385" y="184" width="130" height="62" rx="4" fill="none" stroke="#2f855a" stroke-width="4"/>

  <!-- ticks, numbers, words -->
  <g stroke="#4a5568" stroke-width="2">
    <line x1="60" y1="240" x2="60" y2="252"/><line x1="190" y1="240" x2="190" y2="252"/><line x1="320" y1="240" x2="320" y2="252"/>
    <line x1="450" y1="240" x2="450" y2="252"/><line x1="580" y1="240" x2="580" y2="252"/><line x1="710" y1="240" x2="710" y2="252"/><line x1="840" y1="240" x2="840" y2="252"/>
  </g>
  <g font-size="20" font-weight="bold" fill="#1a202c" text-anchor="middle">
    <text x="60" y="174">-3</text><text x="190" y="174">-2</text><text x="320" y="174">-1</text><text x="450" y="174">0</text>
    <text x="580" y="174">+1</text><text x="710" y="174">+2</text><text x="840" y="174">+3</text>
  </g>
  <g font-size="15" text-anchor="middle">
    <text x="60" y="146" fill="#2b6cb0" font-weight="bold">cold</text>
    <text x="190" y="146" fill="#2b6cb0" font-weight="bold">cool</text>
    <text x="320" y="146" fill="#2b6cb0">slightly cool</text>
    <text x="450" y="146" fill="#2f855a" font-weight="bold">neutral</text>
    <text x="580" y="146" fill="#c53030">slightly warm</text>
    <text x="710" y="146" fill="#c53030" font-weight="bold">warm</text>
    <text x="840" y="146" fill="#c53030" font-weight="bold">hot</text>
  </g>
  <text x="450" y="110" font-size="22" font-weight="bold" fill="#1a202c" text-anchor="middle">PMV: the average comfort vote on a scale from -3 to +3</text>

  <!-- category brackets -->
  <g stroke="#4a5568" stroke-width="3" fill="none">
    <polyline points="424,268 424,280 476,280 476,268"/>
    <polyline points="385,300 385,312 515,312 515,300"/>
    <polyline points="359,332 359,344 541,344 541,332"/>
  </g>
  <polyline points="385,300 385,312 515,312 515,300" stroke="#2f855a" stroke-width="5" fill="none"/>
  <g font-size="15" fill="#4a5568">
    <text x="562" y="285"><tspan font-weight="bold">Category I:</tspan> |PMV| &lt; 0.2</text>
    <text x="562" y="317" fill="#276749"><tspan font-weight="bold">Category II:</tspan> |PMV| &lt; 0.5, this lab's target</text>
    <text x="562" y="349"><tspan font-weight="bold">Category III:</tspan> |PMV| &lt; 0.7</text>
  </g>
  <g font-size="14" fill="#4a5568">
    <text x="60" y="290">outside the</text><text x="60" y="308">categories:</text><text x="60" y="326">unacceptable</text>
  </g>

  <text x="450" y="420" font-size="16" fill="#4a5568" text-anchor="middle">Smaller |PMV| = more people satisfied. At PMV = 0, about 5 % are still unhappy (PPD = 5 %).</text>
  <text x="450" y="448" font-size="16" fill="#4a5568" text-anchor="middle">PPD = Predicted Percentage of Dissatisfied people.</text>
</svg>
