  <rect x="410" y="90" width="100" height="112" rx="8" fill="#edf2f7" stroke="#4a5568" stroke-width="2"/>
  <text x="460" y="112" text-anchor="middle" fill="#4a5568" font-weight="bold" font-size="13">CO₂ sensor</text>
  <rect x="425" y="128" width="70" height="28" rx="4" fill="#ffffff" stroke="#4a5568" stroke-width="2"/>
  <text x="460" y="148" text-anchor="middle" fill="#4a5568" font-size="13">850 ppm</text>
  <text x="460" y="175" text-anchor="middle" fill="#4a5568" font-size="11">ppm = parts</text>
  <text x="460" y="188" text-anchor="middle" fill="#4a5568" font-size="11">per million</text>
  <path d="M340,160 H408" fill="none" stroke="#b7791f" stroke-width="3" marker-end="url(#ay)"/>
  <text x="375" y="150" text-anchor="middle" fill="#4a5568" font-size="12">air</text>
  <line x1="532" y1="140" x2="590" y2="140" stroke="#4a5568" stroke-width="3" marker-end="url(#ag)"/>
  <rect x="592" y="100" width="190" height="80" rx="10" fill="#c6f6d5" stroke="#2f855a" stroke-width="2"/>
  <text x="687" y="128" text-anchor="middle" fill="#2f855a" font-weight="bold" font-size="13">controller</text>
  <text x="687" y="150" text-anchor="middle" fill="#4a5568" font-size="12">if the CO₂ is too</text>
  <text x="687" y="166" text-anchor="middle" fill="#4a5568" font-size="12">high: more fresh air</text>
