<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330" font-family="sans-serif" font-size="14">
  <defs><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c53030"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2b6cb0"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f855a"/></marker><marker id="ay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b7791f"/></marker></defs>
  <rect width="800" height="330" fill="#ffffff"/>
  <rect x="30" y="40" width="500" height="250" rx="8" fill="#f7fafc" stroke="#4a5568" stroke-width="2"/>
  <text x="280" y="62" text-anchor="middle" fill="#4a5568" font-weight="bold">room</text>
  <circle cx="100" cy="235" r="12" fill="#c6f6d5" stroke="#2f855a" stroke-width="2"/>
  <line x1="100" y1="247" x2="100" y2="272" stroke="#2f855a" stroke-width="3"/>
  <circle cx="170" cy="235" r="12" fill="#c6f6d5" stroke="#2f855a" stroke-width="2"/>
  <line x1="170" y1="247" x2="170" y2="272" stroke="#2f855a" stroke-width="3"/>
  <circle cx="240" cy="235" r="12" fill="#c6f6d5" stroke="#2f855a" stroke-width="2"/>
  <line x1="240" y1="247" x2="240" y2="272" stroke="#2f855a" stroke-width="3"/>
  <text x="170" y="305" text-anchor="middle" fill="#2f855a" font-size="13">people breathe out CO₂</text>
  <circle cx="110" cy="200" r="5" fill="#fefcbf" stroke="#b7791f"/>
  <circle cx="150" cy="175" r="5" fill="#fefcbf" stroke="#b7791f"/>
  <circle cx="195" cy="195" r="5" fill="#fefcbf" stroke="#b7791f"/>
  <circle cx="225" cy="160" r="5" fill="#fefcbf" stroke="#b7791f"/>
  <circle cx="270" cy="190" r="5" fill="#fefcbf" stroke="#b7791f"/>
  <circle cx="300" cy="150" r="5" fill="#fefcbf" stroke="#b7791f"/>
