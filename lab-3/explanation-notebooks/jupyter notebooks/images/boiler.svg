<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 345" width="800" height="345" font-family="sans-serif" font-size="14">
  <defs><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c53030"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2b6cb0"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f855a"/></marker><marker id="ay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b7791f"/></marker></defs>
  <rect width="800" height="345" fill="#ffffff"/>
  <rect x="280" y="50" width="240" height="250" rx="14" fill="#edf2f7" stroke="#4a5568" stroke-width="2"/>
  <rect x="300" y="75" width="200" height="100" rx="10" fill="#bee3f8" stroke="#2b6cb0" stroke-width="2"/>
  <text x="400" y="120" text-anchor="middle" fill="#2b6cb0">water is</text>
  <text x="400" y="139" text-anchor="middle" fill="#2b6cb0">heated here</text>
  <rect x="300" y="210" width="200" height="70" rx="10" fill="#fefcbf" stroke="#b7791f" stroke-width="2"/>
  <text x="400" y="240" text-anchor="middle" fill="#4a5568" font-weight="bold">burner</text>
  <text x="400" y="262" text-anchor="middle" fill="#4a5568" font-size="12">(flame or electric heater)</text>
  <line x1="80" y1="245" x2="298" y2="245" stroke="#b7791f" stroke-width="3" marker-end="url(#ay)"/>
  <text x="190" y="205" text-anchor="middle" fill="#4a5568">fuel in:</text>
  <text x="190" y="224" text-anchor="middle" fill="#4a5568">gas, oil or electricity</text>
  <line x1="298" y1="110" x2="80" y2="110" stroke="#c53030" stroke-width="3" marker-end="url(#ar)"/>
  <text x="190" y="62" text-anchor="middle" fill="#c53030">hot water out</text>
  <text x="190" y="81" text-anchor="middle" fill="#c53030">to the building</text>
  <line x1="720" y1="150" x2="502" y2="150" stroke="#2b6cb0" stroke-width="3" marker-end="url(#ab)"/>
  <text x="620" y="100" text-anchor="middle" fill="#2b6cb0">cooler water</text>
  <text x="620" y="119" text-anchor="middle" fill="#2b6cb0">returns from</text>
  <text x="620" y="138" text-anchor="middle" fill="#2b6cb0">the building</text>
  <line x1="502" y1="262" x2="720" y2="262" stroke="#4a5568" stroke-width="3" marker-end="url(#ag)"/>
  <text x="620" y="288" text-anchor="middle" fill="#4a5568">exhaust gases out</text>
  <text x="400" y="325" text-anchor="middle" fill="#4a5568" font-weight="bold">Boiler</text>
</svg>
