<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" font-family="sans-serif" font-size="14">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c53030"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2b6cb0"/></marker>
  </defs>
  <rect width="960" height="420" fill="#ffffff"/>

  <!-- BMS controller -->
  <rect x="390" y="12" width="180" height="44" rx="10" fill="#edf2f7" stroke="#4a5568" stroke-width="2"/>
  <text x="480" y="40" text-anchor="middle" fill="#4a5568" font-weight="bold">BMS controller</text>

  <!-- Plant -->
  <rect x="20" y="100" width="150" height="200" rx="12" fill="#f7fafc" stroke="#4a5568" stroke-width="2"/>
  <text x="95" y="120" text-anchor="middle" fill="#4a5568" font-weight="bold">Plant</text>
  <rect x="32" y="130" width="126" height="60" rx="8" fill="#fed7d7" stroke="#c53030" stroke-width="2"/>
  <text x="95" y="156" text-anchor="middle" fill="#4a5568">Boiler /</text>
  <text x="95" y="174" text-anchor="middle" fill="#4a5568">heat pump</text>
  <rect x="32" y="225" width="126" height="60" rx="8" fill="#bee3f8" stroke="#2b6cb0" stroke-width="2"/>
  <text x="95" y="260" text-anchor="middle" fill="#4a5568">Chiller</text>

  <!-- pipes -->
  <line x1="170" y1="160" x2="248" y2="160" stroke="#c53030" stroke-width="3" marker-end="url(#ar)"/>
  <text x="210" y="148" text-anchor="middle" fill="#c53030">hot water</text>
  <line x1="170" y1="255" x2="248" y2="255" stroke="#2b6cb0" stroke-width="3" marker-end="url(#ab)"/>
  <text x="210" y="243" text-anchor="middle" fill="#2b6cb0">cold water</text>

  <!-- AHU -->
  <rect x="250" y="100" width="170" height="200" rx="12" fill="#edf2f7" stroke="#4a5568" stroke-width="2"/>
  <text x="335" y="140" text-anchor="middle" fill="#4a5568" font-weight="bold">AHU</text>
  <text x="335" y="162" text-anchor="middle" fill="#4a5568">Air Handling Unit</text>
  <text x="335" y="200" text-anchor="middle" fill="#4a5568">filters, heats,</text>
  <text x="335" y="220" text-anchor="middle" fill="#4a5568">cools, moves air</text>

  <!-- supply duct to VAV -->
  <line x1="420" y1="200" x2="498" y2="200" stroke="#4a5568" stroke-width="3" marker-end="url(#ag)"/>
  <text x="459" y="188" text-anchor="middle" fill="#4a5568">supply air</text>

  <!-- VAV -->
  <rect x="500" y="150" width="110" height="100" rx="12" fill="#edf2f7" stroke="#4a5568" stroke-width="2"/>
  <text x="555" y="192" text-anchor="middle" fill="#4a5568" font-weight="bold">VAV box</text>
  <text x="555" y="212" text-anchor="middle" fill="#4a5568">sets airflow</text>
  <text x="555" y="230" text-anchor="middle" fill="#4a5568">per room</text>

  <!-- duct to room -->
  <line x1="610" y1="200" x2="678" y2="200" stroke="#4a5568" stroke-width="3" marker-end="url(#ag)"/>

  <!-- Room -->
  <rect x="680" y="100" width="260" height="200" rx="12" fill="#c6f6d5" stroke="#2f855a" stroke-width="2"/>
  <text x="695" y="124" fill="#4a5568" font-weight="bold">Room</text>
  <circle cx="760" cy="185" r="14" fill="#ffffff" stroke="#4a5568" stroke-width="2"/>
  <line x1="760" y1="199" x2="760" y2="240" stroke="#4a5568" stroke-width="3"/>
  <line x1="742" y1="212" x2="778" y2="212" stroke="#4a5568" stroke-width="3"/>
  <line x1="760" y1="240" x2="745" y2="272" stroke="#4a5568" stroke-width="3"/>
  <line x1="760" y1="240" x2="775" y2="272" stroke="#4a5568" stroke-width="3"/>
  <rect x="850" y="130" width="80" height="40" rx="8" fill="#ffffff" stroke="#2f855a" stroke-width="2"/>
  <text x="890" y="155" text-anchor="middle" fill="#4a5568">sensors</text>
  <text x="890" y="190" text-anchor="middle" fill="#4a5568">T, RH, CO2</text>

  <!-- return air -->
  <path d="M810,300 V335 H335 V302" fill="none" stroke="#4a5568" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#ag)"/>
  <text x="572" y="358" text-anchor="middle" fill="#4a5568">return air</text>

  <!-- control signals -->
  <path d="M890,130 V34 H572" fill="none" stroke="#4a5568" stroke-width="2" stroke-dasharray="3 4" marker-end="url(#ag)"/>
  <text x="730" y="26" text-anchor="middle" fill="#4a5568">measurements</text>
  <path d="M388,34 H95 V98" fill="none" stroke="#4a5568" stroke-width="2" stroke-dasharray="3 4" marker-end="url(#ag)"/>
  <text x="240" y="26" text-anchor="middle" fill="#4a5568">commands</text>
  <path d="M480,58 V80 H335 V98" fill="none" stroke="#4a5568" stroke-width="2" stroke-dasharray="3 4" marker-end="url(#ag)"/>
  <path d="M480,80 H555 V148" fill="none" stroke="#4a5568" stroke-width="2" stroke-dasharray="3 4" marker-end="url(#ag)"/>
</svg>
