<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="sans-serif" font-size="14">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c53030"/></marker>
  </defs>
  <rect width="900" height="470" fill="#ffffff"/>

  <!-- setpoint -->
  <rect x="20" y="130" width="120" height="60" rx="10" fill="#c6f6d5" stroke="#2f855a" stroke-width="2"/>
  <text x="80" y="156" text-anchor="middle" fill="#4a5568" font-weight="bold">Setpoint</text>
  <text x="80" y="176" text-anchor="middle" fill="#4a5568">e.g. 23 C</text>
  <line x1="140" y1="160" x2="185" y2="160" stroke="#4a5568" stroke-width="3" marker-end="url(#ag)"/>

  <!-- comparison junction -->
  <circle cx="205" cy="160" r="18" fill="#ffffff" stroke="#4a5568" stroke-width="2"/>
  <text x="151" y="150" text-anchor="middle" fill="#2f855a" font-weight="bold">+</text>
  <text x="187" y="206" text-anchor="middle" fill="#c53030" font-weight="bold">-</text>
  <line x1="223" y1="160" x2="283" y2="160" stroke="#4a5568" stroke-width="3" marker-end="url(#ag)"/>
  <text x="253" y="148" text-anchor="middle" fill="#4a5568">error</text>

  <!-- controller -->
  <rect x="285" y="125" width="140" height="70" rx="10" fill="#edf2f7" stroke="#4a5568" stroke-width="2"/>
  <text x="355" y="156" text-anchor="middle" fill="#4a5568" font-weight="bold">Controller</text>
  <text x="355" y="176" text-anchor="middle" fill="#4a5568">decides</text>
  <line x1="425" y1="160" x2="493" y2="160" stroke="#4a5568" stroke-width="3" marker-end="url(#ag)"/>
  <text x="459" y="148" text-anchor="middle" fill="#4a5568">signal</text>

  <!-- actuator -->
  <rect x="495" y="125" width="150" height="70" rx="10" fill="#fed7d7" stroke="#c53030" stroke-width="2"/>
  <text x="570" y="156" text-anchor="middle" fill="#4a5568" font-weight="bold">Actuator</text>
  <text x="570" y="176" text-anchor="middle" fill="#4a5568">valve, damper, fan</text>
  <line x1="645" y1="160" x2="713" y2="160" stroke="#c53030" stroke-width="3" marker-end="url(#ar)"/>
  <text x="679" y="148" text-anchor="middle" fill="#c53030">energy</text>

  <!-- room -->
  <rect x="715" y="110" width="165" height="100" rx="12" fill="#c6f6d5" stroke="#2f855a" stroke-width="2"/>
  <text x="797" y="154" text-anchor="middle" fill="#4a5568" font-weight="bold">Room</text>
  <text x="797" y="174" text-anchor="middle" fill="#4a5568">(temperature)</text>

  <!-- disturbances -->
  <rect x="680" y="12" width="215" height="56" rx="10" fill="#ffffff" stroke="#4a5568" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="787" y="36" text-anchor="middle" fill="#4a5568" font-weight="bold">Disturbances</text>
  <text x="787" y="56" text-anchor="middle" fill="#4a5568">sun, people, weather</text>
  <line x1="797" y1="68" x2="797" y2="108" stroke="#4a5568" stroke-width="3" marker-end="url(#ag)"/>

  <!-- sensor and feedback -->
  <line x1="797" y1="210" x2="797" y2="328" stroke="#4a5568" stroke-width="3" marker-end="url(#ag)"/>
  <text x="789" y="275" text-anchor="end" fill="#4a5568">room temperature</text>
  <rect x="715" y="330" width="165" height="60" rx="10" fill="#bee3f8" stroke="#2b6cb0" stroke-width="2"/>
  <text x="797" y="356" text-anchor="middle" fill="#4a5568" font-weight="bold">Sensor</text>
  <text x="797" y="376" text-anchor="middle" fill="#4a5568">thermometer</text>
  <path d="M713,360 H205 V180" fill="none" stroke="#4a5568" stroke-width="3" marker-end="url(#ag)"/>
  <text x="460" y="349" text-anchor="middle" fill="#4a5568">measured temperature</text>

  <text x="450" y="440" text-anchor="middle" fill="#4a5568">The controller keeps correcting until the room matches the setpoint.</text>
</svg>
