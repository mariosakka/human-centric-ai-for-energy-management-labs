<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" font-family="sans-serif" font-size="14">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker>
  </defs>
  <rect width="900" height="460" fill="#ffffff"/>

  <!-- casing -->
  <rect x="100" y="100" width="730" height="320" rx="14" fill="#f7fafc" stroke="#4a5568" stroke-width="2.5"/>
  <text x="465" y="408" text-anchor="middle" fill="#4a5568" font-weight="bold">Air Handling Unit (AHU)</text>

  <!-- supply lane -->
  <line x1="12" y1="185" x2="116" y2="185" stroke="#4a5568" stroke-width="3" marker-end="url(#ag)"/>
  <line x1="203" y1="185" x2="216" y2="185" stroke="#4a5568" stroke-width="3" marker-end="url(#ag)"/>
  <line x1="303" y1="185" x2="316" y2="185" stroke="#4a5568" stroke-width="3" marker-end="url(#ag)"/>
  <line x1="403" y1="185" x2="416" y2="185" stroke="#4a5568" stroke-width="3" marker-end="url(#ag)"/>
  <line x1="503" y1="185" x2="516" y2="185" stroke="#4a5568" stroke-width="3" marker-end="url(#ag)"/>
  <line x1="603" y1="185" x2="616" y2="185" stroke="#4a5568" stroke-width="3" marker-end="url(#ag)"/>
  <line x1="703" y1="185" x2="716" y2="185" stroke="#4a5568" stroke-width="3" marker-end="url(#ag)"/>
  <line x1="803" y1="185" x2="896" y2="185" stroke="#4a5568" stroke-width="3" marker-end="url(#ag)"/>
  <text x="57" y="150" text-anchor="middle" fill="#4a5568">Outdoor</text>
  <text x="57" y="168" text-anchor="middle" fill="#4a5568">air</text>
  <text x="862" y="150" text-anchor="middle" fill="#4a5568">Supply</text>
  <text x="862" y="168" text-anchor="middle" fill="#4a5568">air</text>

  <!-- return / exhaust lane -->
  <line x1="895" y1="350" x2="404" y2="350" stroke="#4a5568" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#ag)"/>
  <line x1="318" y1="350" x2="12" y2="350" stroke="#4a5568" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#ag)"/>
  <text x="862" y="315" text-anchor="middle" fill="#4a5568">Return</text>
  <text x="862" y="333" text-anchor="middle" fill="#4a5568">air</text>
  <text x="57" y="315" text-anchor="middle" fill="#4a5568">Exhaust</text>
  <text x="57" y="333" text-anchor="middle" fill="#4a5568">air</text>

  <!-- recirculation branch -->
  <circle cx="160" cy="350" r="5" fill="#4a5568"/>
  <line x1="160" y1="346" x2="160" y2="223" stroke="#4a5568" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#ag)"/>
  <text x="172" y="290" fill="#4a5568">recycled air</text>

  <!-- components: mixing damper -->
  <rect x="118" y="150" width="84" height="70" rx="8" fill="#edf2f7" stroke="#4a5568" stroke-width="2"/>
  <text x="160" y="182" text-anchor="middle" fill="#4a5568" font-weight="bold">Mixing</text>
  <text x="160" y="200" text-anchor="middle" fill="#4a5568" font-weight="bold">damper</text>
  <!-- filter -->
  <rect x="218" y="150" width="84" height="70" rx="8" fill="#edf2f7" stroke="#4a5568" stroke-width="2"/>
  <text x="260" y="190" text-anchor="middle" fill="#4a5568" font-weight="bold">Filter</text>
  <!-- heat recovery (spans both lanes) -->
  <rect x="318" y="150" width="84" height="240" rx="8" fill="#c6f6d5" stroke="#2f855a" stroke-width="2"/>
  <text x="360" y="262" text-anchor="middle" fill="#4a5568" font-weight="bold">Heat</text>
  <text x="360" y="280" text-anchor="middle" fill="#4a5568" font-weight="bold">recovery</text>
  <!-- heating coil -->
  <rect x="418" y="150" width="84" height="70" rx="8" fill="#fed7d7" stroke="#c53030" stroke-width="2"/>
  <text x="460" y="182" text-anchor="middle" fill="#4a5568" font-weight="bold">Heating</text>
  <text x="460" y="200" text-anchor="middle" fill="#4a5568" font-weight="bold">coil</text>
  <!-- cooling coil -->
  <rect x="518" y="150" width="84" height="70" rx="8" fill="#bee3f8" stroke="#2b6cb0" stroke-width="2"/>
  <text x="560" y="182" text-anchor="middle" fill="#4a5568" font-weight="bold">Cooling</text>
  <text x="560" y="200" text-anchor="middle" fill="#4a5568" font-weight="bold">coil</text>
  <!-- humidifier -->
  <rect x="618" y="150" width="84" height="70" rx="8" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="2"/>
  <text x="660" y="190" text-anchor="middle" fill="#4a5568" font-weight="bold">Humidifier</text>
  <!-- fan -->
  <rect x="718" y="150" width="84" height="70" rx="8" fill="#edf2f7" stroke="#4a5568" stroke-width="2"/>
  <text x="760" y="182" text-anchor="middle" fill="#4a5568" font-weight="bold">Supply</text>
  <text x="760" y="200" text-anchor="middle" fill="#4a5568" font-weight="bold">fan</text>

  <!-- descriptions -->
  <g fill="#4a5568" text-anchor="middle">
    <text x="160" y="36">mixes fresh</text><text x="160" y="54">and recycled</text><text x="160" y="72">air</text>
    <text x="260" y="36">removes dust</text><text x="260" y="54">and pollen</text>
    <text x="360" y="36">reuses heat</text><text x="360" y="54">of exhaust</text><text x="360" y="72">air</text>
    <text x="460" y="36">warms the air</text><text x="460" y="54">in winter</text>
    <text x="560" y="36">cools and</text><text x="560" y="54">dries air</text><text x="560" y="72">in summer</text>
    <text x="660" y="36">adds water</text><text x="660" y="54">vapour when</text><text x="660" y="72">air is dry</text>
    <text x="760" y="36">pushes air</text><text x="760" y="54">to the rooms</text>
  </g>
</svg>
